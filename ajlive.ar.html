<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AJ.Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --aj-bg:#06060a;
    --aj-surface: rgba(16,16,24,.62);
    --aj-surface-solid:#111119;
    --aj-text:#f3f2f8;
    --aj-muted:#9491a8;
    --aj-accent-1:#7c5cfc;
    --aj-accent-2:#00d4ff;
    --aj-live:#ff3b5c;
    --aj-border: rgba(255,255,255,.09);
    --aj-radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--aj-bg);
    overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
  }

  /* ============ PLAYER SHELL ============ */
  .ajlive-player{
    position:absolute; inset:0;
    width:100%; height:100%;
    background:#000;
    display:flex; flex-direction:column;
    user-select:none;
    -webkit-user-select:none;
    cursor:default;
    overflow:hidden;
  }
  .ajlive-player *{ box-sizing:border-box; }
  .ajlive-player.aj-controls-hidden{ cursor:none; }

  .ajlive-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
  }

  /* subtle vignette so glass UI reads on any footage */
  .ajlive-vignette{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 22%),
      linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 16%);
    opacity:1;
    transition:opacity .35s ease;
  }
  .ajlive-player.aj-playing:not(.aj-controls-hidden) .ajlive-vignette,
  .ajlive-player:not(.aj-playing) .ajlive-vignette{ opacity:1; }
  .ajlive-player.aj-playing.aj-controls-hidden .ajlive-vignette{ opacity:.0; }

  /* ============ TOP BAR ============ */
  .ajlive-topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px;
    z-index:5;
    transition:transform .35s ease, opacity .35s ease;
  }
  .aj-controls-hidden .ajlive-topbar{ transform:translateY(-14px); opacity:0; }

  .ajlive-brand{
    display:flex; align-items:center; gap:10px;
  }
  .ajlive-brand-mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(135deg,var(--aj-accent-1),var(--aj-accent-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#0a0a12;
    box-shadow:0 2px 14px rgba(124,92,252,.45);
  }
  .ajlive-brand-word{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;
    letter-spacing:.2px; color:var(--aj-text);
  }
  .ajlive-brand-word span{ color:var(--aj-accent-2); }

  .ajlive-live-badge{
    display:flex; align-items:center; gap:8px;
    background:var(--aj-surface);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--aj-border);
    padding:6px 12px 6px 10px;
    border-radius:999px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; font-weight:600; letter-spacing:.6px;
    color:var(--aj-text);
  }
  .ajlive-pulse{
    position:relative; width:8px; height:8px; border-radius:50%;
    background:var(--aj-live);
    box-shadow:0 0 8px rgba(255,59,92,.8);
  }
  .ajlive-pulse::before, .ajlive-pulse::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    border:1.5px solid var(--aj-live);
    animation:aj-ping 2.2s cubic-bezier(0,.4,.6,1) infinite;
  }
  .ajlive-pulse::after{ animation-delay:1.1s; }
  @keyframes aj-ping{
    0%{ transform:scale(1); opacity:.8; }
    100%{ transform:scale(4.2); opacity:0; }
  }

  .ajlive-viewers{
    display:flex; align-items:center; gap:6px;
    color:var(--aj-muted); font-size:12px; font-weight:500;
    margin-left:4px; padding-left:10px; border-left:1px solid var(--aj-border);
  }
  .ajlive-viewers svg{ width:13px; height:13px; opacity:.8; }

  /* ============ CENTER: buffering / big play ============ */
  .ajlive-center{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:4; pointer-events:none;
  }
  .ajlive-bigplay{
    pointer-events:auto;
    width:76px; height:76px; border-radius:50%;
    background:rgba(12,12,18,.55);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--aj-border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0; transform:scale(.85);
    transition:opacity .3s ease, transform .3s ease, background .2s ease;
  }
  .ajlive-bigplay:hover{ background:rgba(20,20,30,.7); }
  .ajlive-player:not(.aj-playing) .ajlive-bigplay{ opacity:1; transform:scale(1); }
  .ajlive-bigplay svg{ width:28px; height:28px; margin-left:4px; fill:var(--aj-text); }

  .ajlive-spinner{
    width:46px; height:46px; position:relative; opacity:0; transition:opacity .2s ease;
  }
  .ajlive-player.aj-buffering .ajlive-spinner{ opacity:1; }
  .ajlive-player.aj-buffering .ajlive-bigplay{ display:none; }
  .ajlive-spinner::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--aj-accent-2);
    animation:aj-spin .8s linear infinite;
  }
  @keyframes aj-spin{ to{ transform:rotate(360deg); } }

  /* ============ BOTTOM CONTROL BAR ============ */
  .ajlive-controls{
    position:absolute; left:0; right:0; bottom:0;
    z-index:6;
    padding:0 14px 14px;
    transition:transform .35s ease, opacity .35s ease;
  }
  .aj-controls-hidden .ajlive-controls{ transform:translateY(16px); opacity:0; }

  .ajlive-bar{
    display:flex; align-items:center; gap:4px;
    background:var(--aj-surface);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--aj-border);
    border-radius:var(--aj-radius);
    padding:6px 8px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }

  .aj-btn{
    width:38px; height:38px; border:none; background:transparent; border-radius:9px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--aj-text); flex-shrink:0;
    transition:background .15s ease, color .15s ease;
  }
  .aj-btn:hover{ background:rgba(255,255,255,.08); }
  .aj-btn svg{ width:19px; height:19px; fill:currentColor; }
  .aj-btn.aj-active{ color:var(--aj-accent-2); }

  .ajlive-live-pill{
    display:flex; align-items:center; gap:7px;
    padding:0 12px; height:32px; margin:0 2px 0 4px;
    border-radius:8px;
    background:rgba(255,59,92,.12);
    color:var(--aj-live);
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:11.5px;
    letter-spacing:.8px; flex-shrink:0;
    cursor:pointer;
    transition:background .15s ease;
  }
  .ajlive-live-pill:hover{ background:rgba(255,59,92,.2); }
  .ajlive-live-pill .aj-dot{ width:6px; height:6px; border-radius:50%; background:var(--aj-live); }
  .ajlive-live-pill.aj-catchup{ color:var(--aj-muted); background:rgba(255,255,255,.06); }
  .ajlive-live-pill.aj-catchup .aj-dot{ background:var(--aj-muted); }

  .ajlive-spacer{ flex:1 1 auto; }

  .ajlive-time{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--aj-muted);
    padding:0 8px; white-space:nowrap; flex-shrink:0;
  }

  /* volume */
  .ajlive-volume{
    display:flex; align-items:center; position:relative;
  }
  .ajlive-vol-track-wrap{
    width:0; overflow:hidden; transition:width .2s ease;
    display:flex; align-items:center;
  }
  .ajlive-volume:hover .ajlive-vol-track-wrap,
  .ajlive-volume.aj-dragging .ajlive-vol-track-wrap{ width:76px; }
  .ajlive-vol-track{
    position:relative; width:64px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.18); margin:0 8px 0 2px; cursor:pointer;
  }
  .ajlive-vol-fill{
    position:absolute; left:0; top:0; bottom:0; border-radius:2px;
    background:linear-gradient(90deg,var(--aj-accent-1),var(--aj-accent-2));
    width:100%;
  }
  .ajlive-vol-thumb{
    position:absolute; top:50%; width:11px; height:11px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.4);
  }

  /* settings menu */
  .ajlive-menu-wrap{ position:relative; }
  .ajlive-menu{
    position:absolute; bottom:48px; right:0;
    min-width:150px;
    background:var(--aj-surface-solid);
    border:1px solid var(--aj-border);
    border-radius:12px;
    padding:6px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transform:translateY(6px) scale(.97);
    transition:opacity .16s ease, transform .16s ease;
  }
  .ajlive-menu.aj-open{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
  .ajlive-menu-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--aj-text);
  }
  .ajlive-menu-item:hover{ background:rgba(255,255,255,.07); }
  .ajlive-menu-item .aj-check{ width:14px; height:14px; fill:var(--aj-accent-2); opacity:0; }
  .ajlive-menu-item.aj-selected .aj-check{ opacity:1; }
  .ajlive-menu-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--aj-muted);
    padding:8px 10px 4px;
  }
  .ajlive-menu-sep{ height:1px; background:var(--aj-border); margin:4px 2px; }

  .ajlive-quality-tag{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    color:var(--aj-muted); padding:0 4px;
  }

  /* toast */
  .ajlive-toast{
    position:absolute; top:70px; left:22px; z-index:7;
    background:var(--aj-surface); backdrop-filter:blur(10px);
    border:1px solid var(--aj-border); border-radius:10px;
    padding:9px 14px; font-size:13px; color:var(--aj-text);
    opacity:0; transform:translateY(-6px); transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .ajlive-toast.aj-show{ opacity:1; transform:translateY(0); }

  /* mobile */
  @media (max-width:640px){
    .ajlive-topbar{ padding:14px 14px; }
    .ajlive-brand-word{ font-size:16px; }
    .ajlive-viewers{ display:none; }
    .ajlive-vol-track-wrap, .ajlive-volume:hover .ajlive-vol-track-wrap{ width:0 !important; }
    .aj-btn{ width:34px; height:34px; }
    .aj-btn svg{ width:17px; height:17px; }
    .ajlive-bar{ padding:5px 6px; gap:2px; }
    .ajlive-time{ display:none; }
  }
</style>
</head>
<body>

<div id="ajlivePlayer" class="ajlive-player aj-buffering">

  <video class="ajlive-video" playsinline webkit-playsinline preload="metadata" muted></video>

  <div class="ajlive-vignette"></div>

  <!-- top bar -->
  <div class="ajlive-topbar">
    <div class="ajlive-brand">
      <div class="ajlive-brand-mark">A</div>
      <div class="ajlive-brand-word">AJ<span>.</span>Live</div>
    </div>
    <div class="ajlive-live-badge">
      <span class="ajlive-pulse"></span>
      LIVE
      <span class="ajlive-viewers">
        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5C21.3 7.6 17 4.5 12 4.5zm0 12.5c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
        
      </span>
    </div>
  </div>

  <!-- center overlays -->
  <div class="ajlive-center">
    <div class="ajlive-bigplay" id="ajBigPlay">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="ajlive-spinner"></div>
  </div>

  <div class="ajlive-toast" id="ajToast"></div>

  <!-- bottom controls -->
  <div class="ajlive-controls">
    <div class="ajlive-bar">

      <button class="aj-btn" id="ajPlayBtn" title="Play / Pause (space)">
        <svg id="ajPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="ajlive-volume" id="ajVolumeWrap">
        <button class="aj-btn" id="ajMuteBtn" title="Mute (m)">
          <svg id="ajVolIcon" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0014 7.97v8.05A4.48 4.48 0 0016.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <div class="ajlive-vol-track-wrap">
          <div class="ajlive-vol-track" id="ajVolTrack">
            <div class="ajlive-vol-fill" id="ajVolFill"></div>
            <div class="ajlive-vol-thumb" id="ajVolThumb"></div>
          </div>
        </div>
      </div>

      <div class="ajlive-live-pill" id="ajLivePill" title="Jump to live">
        <span class="aj-dot"></span><span id="ajLivePillText">LIVE</span>
      </div>

      <span class="ajlive-time" id="ajTime">00:00</span>

      <div class="ajlive-spacer"></div>

      <div class="ajlive-menu-wrap">
        <button class="aj-btn" id="ajSettingsBtn" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.1 7.1 0 00-1.62-.94l-.36-2.54a.49.49 0 00-.5-.42h-3.84a.49.49 0 00-.5.42l-.36 2.54c-.6.24-1.15.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.66 8.84a.5.5 0 00.12.64l2.03 1.58c-.05.3-.08.62-.08.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.14.24.4.34.65.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .46-.18.5-.42l.36-2.54c.6-.24 1.15-.56 1.62-.94l2.39.96c.25.1.5 0 .65-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg>
        </button>
        <div class="ajlive-menu" id="ajSettingsMenu">
          <div class="ajlive-menu-label">Quality</div>
          <div id="ajQualityList"></div>
          <div class="ajlive-menu-sep"></div>
          <div class="ajlive-menu-label">Playback speed</div>
          <div id="ajSpeedList"></div>
        </div>
      </div>

      <button class="aj-btn" id="ajPipBtn" title="Picture in picture">
        <svg viewBox="0 0 24 24"><path d="M19 7H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2zm0 12H5V9h14v10zM21 3H9a2 2 0 00-2 2v3h2V5h12v10h-4v2h4a2 2 0 002-2V5a2 2 0 00-2-2z"/></svg>
      </button>

      <button class="aj-btn" id="ajFullBtn" title="Fullscreen (f)">
        <svg id="ajFullIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>

    </div>
  </div>

</div>

<script>
(function(){
  const streamUrl = 'https://majed-koora.com/wewe/m3.php';

  const root      = document.getElementById('ajlivePlayer');
  const video     = root.querySelector('.ajlive-video');
  const bigPlay   = document.getElementById('ajBigPlay');
  const playBtn   = document.getElementById('ajPlayBtn');
  const playIcon  = document.getElementById('ajPlayIcon');
  const muteBtn   = document.getElementById('ajMuteBtn');
  const volIcon   = document.getElementById('ajVolIcon');
  const volWrap   = document.getElementById('ajVolumeWrap');
  const volTrack  = document.getElementById('ajVolTrack');
  const volFill   = document.getElementById('ajVolFill');
  const volThumb  = document.getElementById('ajVolThumb');
  const livePill  = document.getElementById('ajLivePill');
  const livePillText = document.getElementById('ajLivePillText');
  const timeEl    = document.getElementById('ajTime');
  const fullBtn   = document.getElementById('ajFullBtn');
  const fullIcon  = document.getElementById('ajFullIcon');
  const pipBtn    = document.getElementById('ajPipBtn');
  const settingsBtn  = document.getElementById('ajSettingsBtn');
  const settingsMenu = document.getElementById('ajSettingsMenu');
  const qualityList  = document.getElementById('ajQualityList');
  const speedList    = document.getElementById('ajSpeedList');
  const toast     = document.getElementById('ajToast');
  const viewerCountEl = document.getElementById('ajViewerCount');

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const ICON_VOL_ON  = '<path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0014 7.97v8.05A4.48 4.48 0 0016.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  const ICON_VOL_OFF = '<path d="M16.5 12A4.5 4.5 0 0014 7.97v1.79l2.48 2.48c.01-.08.02-.16.02-.24zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.7 8.7 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
  const ICON_ENTER_FULL = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
  const ICON_EXIT_FULL  = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';

  let hls = null;
  let controlsTimer = null;
  let userIsSeekingVol = false;
  let liveEdgeMode = true;

  /* ---------- toast ---------- */
  let toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('aj-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('aj-show'), 1800);
  }

  /* ---------- source setup ---------- */
  function setupSource(){
    if (window.Hls && Hls.isSupported()){
      hls = new Hls({ liveSyncDurationCount: 3 });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(evt, data){
        buildQualityMenu(data.levels);
      });
      hls.on(Hls.Events.ERROR, function(evt, data){
        if (data.fatal) showToast('Stream connection issue — retrying…');
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = streamUrl;
      qualityList.innerHTML = '<div class="ajlive-menu-item aj-selected"><span>Auto</span><svg class="aj-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>';
    } else {
      showToast('Live playback is not supported in this browser');
    }
  }

  function buildQualityMenu(levels){
    qualityList.innerHTML = '';
    const makeItem = (label, index, selected) => {
      const el = document.createElement('div');
      el.className = 'ajlive-menu-item' + (selected ? ' aj-selected' : '');
      el.innerHTML = '<span>'+label+'</span><svg class="aj-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
      el.addEventListener('click', () => {
        hls.currentLevel = index;
        [...qualityList.children].forEach(c => c.classList.remove('aj-selected'));
        el.classList.add('aj-selected');
        closeSettings();
        showToast('Quality: ' + label);
      });
      return el;
    };
    qualityList.appendChild(makeItem('Auto', -1, true));
    levels.forEach((lvl, i) => {
      const label = (lvl.height ? lvl.height + 'p' : Math.round(lvl.bitrate/1000)+'kbps');
      qualityList.appendChild(makeItem(label, i, false));
    });
  }

  const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
  SPEEDS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'ajlive-menu-item' + (s === 1 ? ' aj-selected' : '');
    el.innerHTML = '<span>'+(s===1?'Normal':s)+'</span><svg class="aj-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
    el.addEventListener('click', () => {
      video.playbackRate = s;
      [...speedList.children].forEach(c => c.classList.remove('aj-selected'));
      el.classList.add('aj-selected');
      closeSettings();
      showToast(s===1?'Normal speed':s+'x speed');
      if (s !== 1) setLiveEdge(false); else setLiveEdge(true);
    });
    speedList.appendChild(el);
  });

  /* ---------- play / pause ---------- */
  function togglePlay(){
    if (video.paused) video.play().catch(()=>{});
    else video.pause();
  }
  function syncPlayIcon(){
    const playing = !video.paused && !video.ended;
    playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    root.classList.toggle('aj-playing', playing);
  }
  playBtn.addEventListener('click', togglePlay);
  bigPlay.addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);
  video.addEventListener('play', syncPlayIcon);
  video.addEventListener('pause', syncPlayIcon);
  video.addEventListener('waiting', () => root.classList.add('aj-buffering'));
  video.addEventListener('playing', () => root.classList.remove('aj-buffering'));
  video.addEventListener('canplay', () => { root.classList.remove('aj-buffering'); video.play().catch(()=>{}); });

  /* ---------- volume ---------- */
  function setVolumeUI(){
    const v = video.muted ? 0 : video.volume;
    volFill.style.width = (v*100)+'%';
    volThumb.style.left = (v*100)+'%';
    volIcon.innerHTML = v === 0 ? ICON_VOL_OFF : ICON_VOL_ON;
  }
  function setVolumeFromX(clientX){
    const rect = volTrack.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    video.volume = pct;
    video.muted = pct === 0;
    setVolumeUI();
  }
  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) video.volume = 0.5;
    setVolumeUI();
  });
  volTrack.addEventListener('mousedown', (e) => {
    userIsSeekingVol = true;
    volWrap.classList.add('aj-dragging');
    setVolumeFromX(e.clientX);
  });
  window.addEventListener('mousemove', (e) => { if (userIsSeekingVol) setVolumeFromX(e.clientX); });
  window.addEventListener('mouseup', () => { userIsSeekingVol = false; volWrap.classList.remove('aj-dragging'); });

  video.volume = 0.7;
  video.muted = true; // required for autoplay
  setVolumeUI();

  /* ---------- live edge pill ---------- */
  function setLiveEdge(isLive){
    liveEdgeMode = isLive;
    livePill.classList.toggle('aj-catchup', !isLive);
    livePillText.textContent = isLive ? 'LIVE' : 'GO LIVE';
  }
  livePill.addEventListener('click', () => {
    video.playbackRate = 1;
    [...speedList.children].forEach(c => c.classList.remove('aj-selected'));
    speedList.children[2].classList.add('aj-selected');
    if (video.seekable && video.seekable.length){
      video.currentTime = video.seekable.end(video.seekable.length - 1) - 0.5;
    }
    setLiveEdge(true);
    video.play().catch(()=>{});
  });

  /* ---------- elapsed time ---------- */
  function fmt(t){
    if (!isFinite(t) || t < 0) t = 0;
    const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = Math.floor(t%60);
    const pad = n => String(n).padStart(2,'0');
    return h > 0 ? pad(h)+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
  }
  let sessionStart = null;
  video.addEventListener('playing', () => { if (!sessionStart) sessionStart = Date.now(); });
  setInterval(() => {
    if (sessionStart && !video.paused) timeEl.textContent = fmt((Date.now()-sessionStart)/1000);
  }, 1000);

  /* ---------- settings menu ---------- */
  function closeSettings(){ settingsMenu.classList.remove('aj-open'); }
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsMenu.classList.toggle('aj-open');
  });
  document.addEventListener('click', (e) => {
    if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) closeSettings();
  });

  /* ---------- fullscreen ---------- */
  function toggleFullscreen(){
    if (!document.fullscreenElement){
      (root.requestFullscreen || root.webkitRequestFullscreen || function(){}).call(root);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }
  fullBtn.addEventListener('click', toggleFullscreen);
  video.addEventListener('dblclick', toggleFullscreen);
  document.addEventListener('fullscreenchange', () => {
    fullIcon.innerHTML = document.fullscreenElement ? ICON_EXIT_FULL : ICON_ENTER_FULL;
  });

  /* ---------- picture in picture ---------- */
  pipBtn.addEventListener('click', async () => {
    try{
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
    }catch(err){ showToast('Picture in picture unavailable'); }
  });

  /* ---------- keyboard shortcuts ---------- */
  document.addEventListener('keydown', (e) => {
    if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    switch(e.key.toLowerCase()){
      case ' ': e.preventDefault(); togglePlay(); break;
      case 'm': video.muted = !video.muted; setVolumeUI(); break;
      case 'f': toggleFullscreen(); break;
      case 'arrowup': e.preventDefault(); video.volume = Math.min(1, video.volume+0.05); video.muted=false; setVolumeUI(); break;
      case 'arrowdown': e.preventDefault(); video.volume = Math.max(0, video.volume-0.05); setVolumeUI(); break;
    }
    resetControlsTimer();
  });

  /* ---------- auto-hide controls ---------- */
  function resetControlsTimer(){
    root.classList.remove('aj-controls-hidden');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => {
      if (!video.paused) root.classList.add('aj-controls-hidden');
    }, 2800);
  }
  ['mousemove','mousedown','touchstart'].forEach(evt =>
    root.addEventListener(evt, resetControlsTimer)
  );
  resetControlsTimer();

  /* ---------- fake viewer counter (cosmetic, replace with real data) ---------- */
  

  syncPlayIcon();
  setLiveEdge(true);
  setupSource();
})();
</script>
</body>
</html>
