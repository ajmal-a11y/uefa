<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ.Live Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

/* ==========================
   Video
========================== */

video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

#maintenanceVideo{
    display:block;
}

#adVideo{
    display:none;
}

/* ==========================
   Advertisement Overlay
========================== */

#adOverlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.65));
    backdrop-filter:blur(10px);
    z-index:999;
}

.card{

    width:520px;
    max-width:92%;

    padding:40px;

    border-radius:28px;

    background:rgba(18,18,18,.75);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 20px 80px rgba(0,0,0,.65);

    text-align:center;

    color:#fff;

    animation:popup .5s ease;
}

@keyframes popup{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.logo{

    width:120px;
    height:120px;

    object-fit:cover;

    border-radius:28px;

    margin-bottom:20px;
}

.card h1{

    font-size:42px;

    margin-bottom:15px;
}

.card p{

    color:#d5d5d5;

    line-height:1.7;

    margin-bottom:30px;

    font-size:18px;
}

.download{

    display:inline-block;

    text-decoration:none;

    background:#0d6efd;

    color:#fff;

    padding:16px 36px;

    border-radius:14px;

    font-size:18px;

    font-weight:600;

    transition:.3s;
}

.download:hover{
    background:#0057d8;
    transform:translateY(-2px);
}

/* Optional countdown */

#count{

    margin-top:22px;

    color:#bbb;

    font-size:15px;
}
</style>
</head>

<body>

<!-- ==========================
     Maintenance Video
========================== -->

<video
    id="maintenanceVideo"
    autoplay
    muted
    loop
    playsinline
    disablePictureInPicture>

    <source src="watermark-removed-Create_a_second_cinematic_m.mp4" type="video/mp4">

</video>


<!-- ==========================
     Advertisement Video
========================== -->

<video
    id="adVideo"
    playsinline
    disablePictureInPicture>

    <source src="watermark-removed-Dont_change_logo_icon_of_the_a.mp4" type="video/mp4">

</video>


<!-- ==========================
     Advertisement Card
========================== -->

<div id="adOverlay">

    <div class="card">

        <img
            src="https://i.ibb.co/ZzLd70ST/Gemini-Generated-Image-9yh6cz9yh6cz9yh6-removebg-preview.png"
            class="logo"
            alt="NovaTalk">

        <h1>NovaTalk</h1>

        <p>
            Meet new people instantly with secure voice and video chats.
            Download NovaTalk today and start connecting with people around the world.
        </p>

        <a
            
            href="https://ajapplications.in.net/novatalk/download/"
            

            Download Now

        </a>

        <div id="count"></div>

    </div>

</div>

<script>

const maintenance=document.getElementById("maintenanceVideo");
const ad=document.getElementById("adVideo");
const overlay=document.getElementById("adOverlay");
const count=document.getElementById("count");

/* Show advertisement every minute */

const AD_INTERVAL=60000;

function scheduleNextAd(){

    setTimeout(playAdvertisement,AD_INTERVAL);

}

function playAdvertisement(){

    maintenance.pause();

    maintenance.style.display="none";

    ad.style.display="block";

    overlay.style.display="flex";

    ad.currentTime=0;

    ad.play();

    let timer=setInterval(()=>{

        let left=Math.ceil(ad.duration-ad.currentTime);

        if(isFinite(left))
            count.innerText="Advertisement ends in "+left+"s";

    },500);

    ad.onended=function(){

        clearInterval(timer);

        overlay.style.display="none";

        ad.style.display="none";

        maintenance.style.display="block";

        maintenance.play();

        scheduleNextAd();

    }

}

/* Disable Right Click */

document.addEventListener("contextmenu",e=>e.preventDefault());

/* Keep maintenance video playing */

document.addEventListener("visibilitychange",()=>{

    if(document.hidden) return;

    if(ad.style.display==="none"){

        maintenance.play().catch(()=>{});

    }

});

scheduleNextAd();

</script>

</body>
</html>
