<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ.Live Loop Video</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>
<body>

<video
    autoplay
    muted
    loop
    playsinline
    controls
>
    <source src="maintenance.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>

</body>
</html>
