<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AJ.Live — Console</title>
<!-- Two streaming engines, auto-selected by manifest type. No DPlayer. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =================================================================
     DESIGN TOKENS — "OB Van" broadcast console
     Grounded in real broadcast-engineering hardware: tally lamps,
     VU/scope panels, rack-mounted transport decks, screwed bezels.
     No border-radius anywhere except lamps/knobs (physical parts
     are round; panels are milled flat). Everything reads off a
     monospace face because that's what gear LCDs use.
     ================================================================= */
  :root{
    --aj-void:       #060607;   /* stage behind the console */
    --aj-panel:      #131317;   /* console body */
    --aj-panel-lo:   #0c0d0f;   /* recessed / well */
    --aj-panel-hi:   #1c1e22;   /* raised button face */
    --aj-panel-hi2:  #24262b;   /* button hover face */
    --aj-hair:       rgba(255,255,255,.07);
    --aj-hair-strong:rgba(255,255,255,.16);
    --aj-ink:        #eae6dd;   /* printed-label off-white */
    --aj-ink-dim:    #85817a;
    --aj-ink-faint:  #4c4a46;
    --aj-tally:      #e2271c;   /* genuine broadcast tally red */
    --aj-tally-glow: rgba(226,39,28,.55);
    --aj-amber:      #e8a53b;   /* VU warn zone */
    --aj-phosphor:   #4be08a;   /* scope-trace green, CRT phosphor */
    --aj-phosphor-dim: rgba(75,224,138,.25);
    --aj-signal:     #6f9bff;   /* digital telemetry blue */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--aj-void); overflow:hidden; font-family:'IBM Plex Mono',monospace; }

  .ajlive-player{
    position:absolute; inset:0; width:100%; height:100%;
    overflow:hidden; -webkit-user-select:none; user-select:none; line-height:1;
    background:#000; cursor:default;
  }
  .ajlive-player *{ box-sizing:border-box; }
  .ajlive-player.aj-fulled{ position:fixed; z-index:100000; left:0; top:0; width:100% !important; height:100% !important; }
  .ajlive-player.aj-hide-controls{ cursor:none; }

  .ajlive-video{ position:absolute; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }

  /* ---- console bezel: milled frame + corner rivets ---- */
  .ajlive-bezel{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .ajlive-bezel:before{
    content:''; position:absolute; inset:10px; border:1px solid var(--aj-hair-strong);
    opacity:.5; transition:opacity .35s ease;
  }
  .ajlive-player.aj-hide-controls .ajlive-bezel:before{ opacity:0; }
  .aj-rivet{ position:absolute; width:5px; height:5px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #444 0%, #1a1a1a 60%, #000 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06); opacity:.55; transition:opacity .35s ease; }
  .ajlive-player.aj-hide-controls .aj-rivet{ opacity:0; }
  .aj-rivet.rv-tl{ top:6px; left:6px; } .aj-rivet.rv-tr{ top:6px; right:6px; }
  .aj-rivet.rv-bl{ bottom:6px; left:6px; } .aj-rivet.rv-br{ bottom:6px; right:6px; }

  .ajlive-overlay-scanlines{ position:absolute; inset:0; pointer-events:none; z-index:1; opacity:.045;
    background:repeating-linear-gradient(to bottom,#fff 0px,#fff 1px,transparent 1px,transparent 3px); mix-blend-mode:overlay; }
  .ajlive-overlay-vignette{ position:absolute; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(to top,rgba(0,0,0,.72) 0%,transparent 22%),linear-gradient(to bottom,rgba(0,0,0,.55) 0%,transparent 16%);
    transition:opacity .3s ease; }
  .ajlive-player.aj-playing.aj-hide-controls .ajlive-overlay-vignette{ opacity:0; }

  /* ---- header strip: tally lamp / wordmark / telemetry ---- */
  .ajlive-header{ position:absolute; top:16px; left:16px; right:16px; z-index:3; display:flex; align-items:flex-start;
    justify-content:space-between; transition:transform .35s ease, opacity .35s ease; pointer-events:none; }
  .ajlive-player.aj-hide-controls .ajlive-header{ transform:translateY(-8px); opacity:0; }

  .ajlive-bug{ display:flex; align-items:center; gap:10px; background:rgba(8,8,9,.55); border:1px solid var(--aj-hair-strong);
    padding:6px 12px 6px 8px; backdrop-filter:blur(2px); }
  .aj-lamp{ position:relative; width:11px; height:11px; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%, #ff6b60 0%, var(--aj-tally) 55%, #7c0f09 100%);
    box-shadow:0 0 8px 1px var(--aj-tally-glow), inset 0 0 2px rgba(0,0,0,.5);
    animation:aj-lamp-flicker 6s ease-in-out infinite; }
  @keyframes aj-lamp-flicker{ 0%,91%,100%{opacity:1;} 92%{opacity:.5;} 93%{opacity:1;} 96%{opacity:.65;} 97%{opacity:1;} }
  .ajlive-bug-text{ display:flex; flex-direction:column; line-height:1; gap:3px; }
  .ajlive-bug-word{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; letter-spacing:1px;
    color:var(--aj-ink); text-transform:uppercase; }
  .ajlive-bug-sub{ font-size:8.5px; letter-spacing:2.5px; color:var(--aj-ink-dim); text-transform:uppercase; font-weight:500; }

  .ajlive-telemetry{ display:flex; gap:1px; background:var(--aj-hair-strong); border:1px solid var(--aj-hair-strong); }
  .aj-tel{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; background:rgba(8,8,9,.6);
    padding:6px 11px; min-width:64px; }
  .aj-tel-label{ font-size:8px; letter-spacing:1.8px; color:var(--aj-ink-dim); text-transform:uppercase; }
  .aj-tel-value{ font-size:12.5px; font-weight:600; color:var(--aj-ink); font-variant-numeric:tabular-nums; }
  .aj-tel-value.aj-good{ color:var(--aj-phosphor); }

  /* ---- big transport control (center) ---- */
  .ajlive-bigplay{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.92); z-index:2;
    width:64px; height:64px; border:1px solid var(--aj-hair-strong); background:rgba(9,9,10,.55);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .25s ease, transform .25s ease, border-color .15s ease, background .15s ease; }
  .ajlive-bigplay:before{ content:''; position:absolute; inset:6px; border:1px solid var(--aj-hair); pointer-events:none; }
  .ajlive-bigplay:hover{ border-color:var(--aj-ink-dim); background:rgba(18,18,20,.7); }
  .ajlive-player.aj-paused .ajlive-bigplay{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .ajlive-player.aj-loading .ajlive-bigplay{ display:none; }
  .ajlive-bigplay svg{ width:22px; height:22px; margin-left:3px; }
  .ajlive-bigplay svg path{ fill:var(--aj-ink); }

  /* ---- signal-search loading state ---- */
  .ajlive-loading{ display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2;
    flex-direction:column; align-items:center; gap:10px; }
  .ajlive-player.aj-loading .ajlive-loading{ display:flex; }
  .aj-sweep{ width:120px; height:2px; background:rgba(255,255,255,.08); position:relative; overflow:hidden; }
  .aj-sweep:after{ content:''; position:absolute; top:0; left:-40%; width:40%; height:100%;
    background:linear-gradient(90deg, transparent, var(--aj-phosphor), transparent);
    animation:aj-sweep-move 1.1s ease-in-out infinite; }
  @keyframes aj-sweep-move{ 0%{left:-40%;} 100%{left:100%;} }
  .aj-loading-label{ font-size:9px; letter-spacing:2.5px; color:var(--aj-ink-dim); text-transform:uppercase; }

  /* ---- notices ---- */
  .ajlive-notice-list{ position:absolute; bottom:76px; left:18px; z-index:5; }
  .ajlive-notice{ border:1px solid var(--aj-hair-strong); border-left:2px solid var(--aj-tally); background:var(--aj-panel);
    color:var(--aj-ink); display:table; pointer-events:none; font-size:11.5px; letter-spacing:.3px;
    animation:aj-notice-show .25s ease 1 forwards; }
  @keyframes aj-notice-show{ from{padding:0;font-size:0;margin-top:0;opacity:0;} to{padding:8px 13px;font-size:11.5px;margin-top:6px;opacity:1;} }
  .ajlive-notice.aj-remove{ animation:aj-notice-hide .25s ease 1 forwards; }
  @keyframes aj-notice-hide{ from{padding:8px 13px;font-size:11.5px;margin-top:6px;opacity:1;} to{padding:0;font-size:0;margin-top:0;opacity:0;} }

  /* =================================================================
     CONTROL DECK — physical fader-strip layout
     ================================================================= */
  .ajlive-controller{ position:absolute; bottom:0; left:0; right:0; z-index:3;
    background:var(--aj-panel); border-top:1px solid var(--aj-tally);
    box-shadow:0 -1px 0 rgba(0,0,0,.6), 0 -14px 30px rgba(0,0,0,.45);
    transition:transform .3s ease, opacity .3s ease;
    display:flex; align-items:stretch; height:68px; padding:0 10px; gap:0; }
  .ajlive-player.aj-hide-controls .ajlive-controller{ transform:translateY(100%); opacity:0; }
  @media (min-width:900px){
    .ajlive-player.aj-playing .ajlive-controller{ opacity:0; }
    .ajlive-player.aj-playing:hover .ajlive-controller{ opacity:1; }
    .ajlive-player.aj-playing.aj-hide-controls .ajlive-controller{ opacity:0; }
  }

  .aj-deck-section{ display:flex; align-items:center; gap:2px; }
  .aj-deck-divider{ width:1px; align-self:stretch; margin:12px 8px; background:var(--aj-hair-strong); flex:0 0 auto; }
  .aj-deck-fill{ flex:1 1 auto; min-width:0; }

  /* labeled console button: icon face + printed caption underneath */
  .aj-ctrl{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px 8px; cursor:pointer;
    background:transparent; border:none; -webkit-appearance:none; flex:0 0 auto; }
  .aj-ctrl-face{ width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    background:var(--aj-panel-hi); border:1px solid var(--aj-hair-strong); transition:background .12s ease, border-color .12s ease; }
  .aj-ctrl:hover .aj-ctrl-face{ background:var(--aj-panel-hi2); border-color:var(--aj-ink-faint); }
  .aj-ctrl:active .aj-ctrl-face{ background:var(--aj-panel-lo); }
  .aj-ctrl-face svg{ width:15px; height:15px; }
  .aj-ctrl-face svg path, .aj-ctrl-face svg rect{ fill:var(--aj-ink); }
  .aj-ctrl-cap{ font-size:7.5px; letter-spacing:1.6px; color:var(--aj-ink-dim); text-transform:uppercase; white-space:nowrap; }

  .aj-icon-play{ display:block; } .aj-icon-pause{ display:none; }
  .ajlive-player.aj-playing .aj-icon-play{ display:none; } .ajlive-player.aj-playing .aj-icon-pause{ display:block; }
  .ajlive-player.aj-playing #ajPlayBtn .aj-ctrl-cap:after{ content:'PAUSE'; }

  /* tally chip + timecode block */
  .aj-tally-chip{ display:flex; align-items:center; gap:6px; height:26px; padding:0 10px;
    border:1px solid var(--aj-tally); background:rgba(226,39,28,.08);
    font-weight:600; font-size:10px; letter-spacing:1.5px; color:var(--aj-tally); text-transform:uppercase; flex:0 0 auto; }
  .aj-tally-chip i{ width:6px; height:6px; border-radius:50%; background:var(--aj-tally);
    box-shadow:0 0 6px var(--aj-tally-glow); animation:aj-lamp-flicker 6s ease-in-out infinite; }

  .aj-tc-block{ display:flex; flex-direction:column; gap:2px; padding:0 10px; flex:0 0 auto; }
  .aj-tc-label{ font-size:7px; letter-spacing:1.6px; color:var(--aj-ink-faint); text-transform:uppercase; }
  .aj-tc-value{ font-size:13px; font-weight:600; color:var(--aj-ink); font-variant-numeric:tabular-nums; letter-spacing:.5px; }

  .aj-golive{ display:flex; align-items:center; gap:6px; height:26px; padding:0 11px;
    border:1px solid var(--aj-hair-strong); background:transparent; color:var(--aj-ink-dim);
    font-weight:600; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; flex:0 0 auto; }
  .aj-golive:hover{ border-color:var(--aj-ink); color:var(--aj-ink); }
  .aj-golive .dot{ width:5px; height:5px; border-radius:50%; background:var(--aj-ink-faint); }
  .aj-golive.aj-live .dot{ background:var(--aj-tally); box-shadow:0 0 5px var(--aj-tally-glow); }

  /* ---- signature element: real oscilloscope, phosphor trace ---- */
  .aj-scope{ position:relative; height:40px; flex:1 1 auto; min-width:60px; border:1px solid var(--aj-hair-strong);
    background:var(--aj-panel-lo); overflow:hidden; margin:0 4px; }
  .aj-scope canvas{ width:100%; height:100%; display:block; }
  .aj-scope-label{ position:absolute; top:2px; left:5px; font-size:6.5px; letter-spacing:1.5px; color:var(--aj-ink-faint);
    text-transform:uppercase; pointer-events:none; z-index:1; }

  /* volume */
  .aj-volume{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .aj-volume-bar-wrap{ width:0; overflow:hidden; transition:width .18s ease; display:flex; align-items:center; height:8px; }
  .aj-volume:hover .aj-volume-bar-wrap, .aj-volume.aj-active .aj-volume-bar-wrap{ width:56px; }
  .aj-volume-bar{ position:relative; width:52px; height:3px; background:var(--aj-hair-strong); cursor:pointer; margin-left:6px; }
  .aj-volume-bar-inner{ position:absolute; top:0; left:0; bottom:0; background:var(--aj-phosphor); width:100%; }

  /* speed / settings popover */
  .aj-setting{ position:relative; }
  .aj-setting-box{ position:absolute; right:0; bottom:66px; transform:scale(.97) translateY(4px);
    width:96px; text-align:center; background:var(--aj-panel-hi); border:1px solid var(--aj-hair-strong); padding:2px; overflow:hidden;
    opacity:0; pointer-events:none; transition:opacity .12s ease, transform .12s ease; z-index:4; }
  .aj-setting-box.aj-open{ opacity:1; pointer-events:auto; transform:scale(1) translateY(0); }
  .aj-setting-item{ height:30px; padding:0 10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:11px; color:var(--aj-ink); }
  .aj-setting-item:hover{ background:var(--aj-panel-hi2); }
  .aj-setting-item.aj-active{ color:var(--aj-phosphor); }

  @media (max-width:760px){
    .ajlive-telemetry{ display:none; }
    .aj-tc-block, .aj-scope{ display:none; }
    .aj-ctrl-cap{ display:none; }
    .aj-ctrl{ padding:6px; }
    .ajlive-controller{ height:52px; }
  }
</style>
</head>
<body>

<div id="ajlivePlayer" class="ajlive-player aj-paused aj-loading">
  <video id="ajVideo" class="ajlive-video" playsinline webkit-playsinline muted></video>

  <div class="ajlive-overlay-vignette"></div>
  <div class="ajlive-overlay-scanlines"></div>
  <div class="ajlive-bezel">
    <span class="aj-rivet rv-tl"></span><span class="aj-rivet rv-tr"></span>
    <span class="aj-rivet rv-bl"></span><span class="aj-rivet rv-br"></span>
  </div>

  <div class="ajlive-header">
    <div class="ajlive-bug">
      <span class="aj-lamp"></span>
      <div class="ajlive-bug-text">
        <div class="ajlive-bug-word">AJ.Live</div>
        <div class="ajlive-bug-sub">CH.01 — Transmission</div>
      </div>
    </div>
    <div class="ajlive-telemetry">
      <div class="aj-tel">
        <span class="aj-tel-label">Signal</span>
        <span class="aj-tel-value" id="ajSignalReadout">—</span>
      </div>
      <div class="aj-tel">
        <span class="aj-tel-label">Aud</span>
        <span class="aj-tel-value aj-good" id="ajViewerCount">—</span>
      </div>
    </div>
  </div>

  <div class="ajlive-bigplay" id="ajBigPlay">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </div>

  <div class="ajlive-loading">
    <div class="aj-sweep"></div>
    <div class="aj-loading-label">Searching signal</div>
  </div>

  <div class="ajlive-notice-list" id="ajNoticeList"></div>

  <div class="ajlive-controller" id="ajController">

    <button class="aj-ctrl" id="ajPlayBtn" title="Play/Pause">
      <span class="aj-ctrl-face">
        <svg class="aj-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="aj-icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </span>
      <span class="aj-ctrl-cap">Play</span>
    </button>

    <div class="aj-deck-divider"></div>

    <div class="aj-tally-chip"><i></i>Live</div>

    <div class="aj-tc-block">
      <span class="aj-tc-label">Timecode</span>
      <span class="aj-tc-value" id="ajTcVal">00:00:00</span>
    </div>

    <span class="aj-golive aj-live" id="ajGoLive"><span class="dot"></span><span id="ajGoLiveText">On edge</span></span>

    <div class="aj-scope" id="ajScopeWrap">
      <span class="aj-scope-label">Mon</span>
      <canvas id="ajScope"></canvas>
    </div>

    <div class="aj-deck-fill"></div>
    <div class="aj-deck-divider"></div>

    <div class="aj-volume" id="ajVolume">
      <button class="aj-ctrl" id="ajMuteBtn" title="Mute/Unmute" style="padding:6px 4px 0;">
        <span class="aj-ctrl-face">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
        </span>
      </button>
      <div class="aj-volume-bar-wrap">
        <div class="aj-volume-bar" id="ajVolumeBar">
          <div class="aj-volume-bar-inner" id="ajVolumeBarInner" style="width:100%"></div>
        </div>
      </div>
    </div>

    <div class="aj-setting" id="ajSetting">
      <button class="aj-ctrl" id="ajSettingBtn" title="Speed">
        <span class="aj-ctrl-face">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.5.5 0 0014 2h-4a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 00-.59.22L2.62 8.48a.5.5 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.14.22.4.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.28.27.42.5.42h4c.24 0 .46-.14.5-.42l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.45 0 .59-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg>
        </span>
        <span class="aj-ctrl-cap">Speed</span>
      </button>
      <div class="aj-setting-box" id="ajSettingBox">
        <div class="aj-setting-item aj-speed-item aj-active" data-speed="1">1x live</div>
        <div class="aj-setting-item aj-speed-item" data-speed="0.5">0.5x</div>
        <div class="aj-setting-item aj-speed-item" data-speed="1.5">1.5x</div>
        <div class="aj-setting-item aj-speed-item" data-speed="2">2x</div>
      </div>
    </div>

    <button class="aj-ctrl" id="ajPipBtn" title="Picture in picture">
      <span class="aj-ctrl-face">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--aj-ink)" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="0.5"/><rect x="12" y="11.5" width="7" height="5" fill="var(--aj-ink)" stroke="none"/></svg>
      </span>
      <span class="aj-ctrl-cap">Pip</span>
    </button>

    <button class="aj-ctrl" id="ajFullBtn" title="Fullscreen">
      <span class="aj-ctrl-face">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </span>
      <span class="aj-ctrl-cap">Full</span>
    </button>

  </div>
</div>

<script>
(function(){
  /* ---------------------------------------------------------------
     STREAM CONFIG
     - Set `url` to either an .m3u8 (HLS) or .mpd (DASH) manifest.
     - The engine is auto-selected from the URL/extension.
     - keyId/key are only used for DASH streams protected with
       ClearKey DRM. Leave them null for unencrypted streams.
     The DASH url/keys below are the example values provided —
     swap in your real stream for production use.
  --------------------------------------------------------------- */
  const STREAM_CONFIG = {
    // HLS example (swap in by uncommenting):
    // url: 'https://majed-koora.com/wewe/m3.php',

    // DASH + ClearKey example:
    url:   'http://40.160.24.55/TSN_2/index.m3u8',
    keyId: 'aa78205160ef4b5c972d5e815a8fe6e4',
    key:   '338b545591e45469e71dae3a8fb8dbb0'
  };

  const streamUrl = STREAM_CONFIG.url;
  const player = document.getElementById('ajlivePlayer');
  const video  = document.getElementById('ajVideo');

  if (!player || !video) {
    console.error('ajlive: required root elements (#ajlivePlayer / #ajVideo) not found — aborting init');
    return;
  }

  function detectStreamType(url){
    if (!url) return 'unknown';
    const clean = url.split('?')[0].toLowerCase();
    if (clean.endsWith('.mpd')) return 'dash';
    if (clean.endsWith('.m3u8')) return 'hls';
    return 'hls'; // fallback default
  }

  /* ---------------------------------------------------------------
     Notices
  --------------------------------------------------------------- */
  const noticeList = document.getElementById('ajNoticeList');
  function notice(text, duration){
    duration = duration || 2000;
    if (!noticeList) { console.log('[ajlive notice]', text); return; }
    const el = document.createElement('div');
    el.className = 'ajlive-notice';
    el.textContent = text;
    noticeList.appendChild(el);
    setTimeout(() => {
      el.classList.add('aj-remove');
      setTimeout(() => el.remove(), 260);
    }, duration);
  }

  /* ---------------------------------------------------------------
     Signal readout (real bitrate/resolution telemetry when available)
  --------------------------------------------------------------- */
  const signalReadout = document.getElementById('ajSignalReadout');
  function setSignalReadout(text){ if (signalReadout) signalReadout.textContent = text; }

  /* ---------------------------------------------------------------
     Streaming engines — hls.js for .m3u8, dash.js for .mpd.
  --------------------------------------------------------------- */
  let hls = null;
  let dash = null;

  function setLoading(isLoading){
    player.classList.toggle('aj-loading', isLoading);
  }

  function attemptAutoplay(){
    video.muted = true; // required for autoplay policies
    video.play().catch(() => {
      setLoading(false);
      player.classList.add('aj-paused');
    });
  }

  function initHls(){
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => attemptAutoplay());
      return;
    }
    if (typeof Hls === 'undefined' || !Hls.isSupported()) {
      console.error('ajlive: hls.js not available/supported in this browser');
      notice('HLS playback not supported in this browser', 4000);
      setLoading(false);
      return;
    }

    hls = new Hls({ liveSyncDurationCount: 3, enableWorker: false });
    hls.loadSource(streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      setLoading(false);
      attemptAutoplay();
    });

    hls.on(Hls.Events.LEVEL_SWITCHED, (evt, data) => {
      const lvl = hls.levels && hls.levels[data.level];
      if (lvl) setSignalReadout(lvl.height + 'p / ' + Math.round(lvl.bitrate / 1000) + 'k');
    });

    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data) return;
      if (data.fatal) {
        notice('SIGNAL LOST — reconnecting', 2500);
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
          case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
          default: hls.destroy(); hls = null; initHls(); break;
        }
      }
    });
  }

  function initDash(){
    if (typeof dashjs === 'undefined') {
      console.error('ajlive: dash.js not available — check CDN / network');
      notice('DASH playback library failed to load', 4000);
      setLoading(false);
      return;
    }

    dash = dashjs.MediaPlayer().create();

    if (STREAM_CONFIG.keyId && STREAM_CONFIG.key) {
      dash.setProtectionData({
        'org.w3.clearkey': {
          'clearkeys': { [STREAM_CONFIG.keyId]: STREAM_CONFIG.key }
        }
      });
      console.log('ajlive: ClearKey DRM configured for DASH stream');
    }

    dash.updateSettings({
      streaming: {
        liveDelay: 6,
        liveCatchup: { enabled: true, mode: 'liveCatchupModeLoLP' }
      }
    });

    dash.initialize(video, streamUrl, false);

    dash.on(dashjs.MediaPlayer.events.CAN_PLAY, () => {
      setLoading(false);
      attemptAutoplay();
    });

    dash.on(dashjs.MediaPlayer.events.QUALITY_CHANGE_RENDERED, () => {
      try{
        const idx = dash.getQualityFor('video');
        const list = dash.getBitrateInfoListFor('video');
        const info = list && list[idx];
        if (info) setSignalReadout(info.height + 'p / ' + Math.round(info.bitrate / 1000) + 'k');
      }catch(e){ /* non-fatal telemetry miss */ }
    });

    dash.on(dashjs.MediaPlayer.events.ERROR, (e) => {
      console.error('ajlive: dash.js error', e);
      notice('SIGNAL LOST — reconnecting', 2500);
    });

    dash.on(dashjs.MediaPlayer.events.PLAYBACK_ERROR, (e) => {
      console.error('ajlive: dash.js playback error', e);
      notice('Playback error — attempting recovery', 2500);
    });
  }

  function initStream(){
    setLoading(true);
    const type = detectStreamType(streamUrl);
    console.log('ajlive: detected stream type =', type, '(' + streamUrl + ')');
    try { video.crossOrigin = 'anonymous'; } catch(e){ /* some hosts reject this; scope falls back gracefully */ }
    if (type === 'dash') initDash();
    else initHls();
  }

  initStream();

  /* ---------------------------------------------------------------
     Play / pause state sync
  --------------------------------------------------------------- */
  video.addEventListener('playing', () => {
    player.classList.remove('aj-paused');
    player.classList.add('aj-playing');
    setLoading(false);
    if (!sessionStart) sessionStart = Date.now();
  });
  video.addEventListener('pause', () => {
    player.classList.add('aj-paused');
    player.classList.remove('aj-playing');
  });
  video.addEventListener('waiting', () => setLoading(true));
  video.addEventListener('canplay', () => setLoading(false));

  function togglePlay(){
    if (video.paused) video.play().catch(() => notice('Unable to play', 1800));
    else video.pause();
    ensureAudioAnalyser();
  }

  const bigPlayBtn = document.getElementById('ajBigPlay');
  if (bigPlayBtn) bigPlayBtn.addEventListener('click', togglePlay);
  else console.warn('ajlive: #ajBigPlay not found — big play button disabled');

  const playBtn = document.getElementById('ajPlayBtn');
  if (playBtn) playBtn.addEventListener('click', togglePlay);
  else console.warn('ajlive: #ajPlayBtn not found — controller play button disabled');

  /* ---------------------------------------------------------------
     Timecode
  --------------------------------------------------------------- */
  let sessionStart = null;
  const tcVal = document.getElementById('ajTcVal');
  function fmt(t){
    if (!isFinite(t) || t < 0) t = 0;
    const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = Math.floor(t%60);
    const pad = n => String(n).padStart(2,'0');
    return pad(h)+':'+pad(m)+':'+pad(s);
  }
  setInterval(() => {
    if (sessionStart && !video.paused && tcVal) tcVal.textContent = fmt((Date.now()-sessionStart)/1000);
  }, 1000);

  /* ---------------------------------------------------------------
     Go-live + speed menu
  --------------------------------------------------------------- */
  const goLive = document.getElementById('ajGoLive');
  const goLiveText = document.getElementById('ajGoLiveText');
  function setLiveEdge(isLive){
    if (goLiveText) goLiveText.textContent = isLive ? 'On edge' : 'Go live';
    if (goLive) goLive.classList.toggle('aj-live', isLive);
  }
  if (goLive) {
    goLive.addEventListener('click', () => {
      video.playbackRate = 1;
      if (video.seekable && video.seekable.length){
        video.currentTime = video.seekable.end(video.seekable.length - 1) - 0.5;
      }
      setLiveEdge(true);
      video.play().catch(() => {});
      document.querySelectorAll('.aj-speed-item').forEach(i => i.classList.toggle('aj-active', i.dataset.speed === '1'));
    });
  } else {
    console.warn('ajlive: #ajGoLive not found — go-live control disabled');
  }

  const settingBtn = document.getElementById('ajSettingBtn');
  const settingBox = document.getElementById('ajSettingBox');
  if (settingBtn && settingBox) {
    settingBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingBox.classList.toggle('aj-open');
    });
    settingBox.querySelectorAll('.aj-speed-item').forEach(item => {
      item.addEventListener('click', () => {
        const speed = parseFloat(item.dataset.speed);
        video.playbackRate = speed;
        settingBox.querySelectorAll('.aj-speed-item').forEach(i => i.classList.remove('aj-active'));
        item.classList.add('aj-active');
        setLiveEdge(speed === 1);
        settingBox.classList.remove('aj-open');
      });
    });
    document.addEventListener('click', () => settingBox.classList.remove('aj-open'));
  } else {
    console.warn('ajlive: speed settings menu elements not found — speed control disabled');
  }

  /* ---------------------------------------------------------------
     SIGNATURE ELEMENT — real oscilloscope trace
     Driven by Web Audio AnalyserNode reading the actual decoded
     stream audio. If the stream is muted (autoplay-gated) or the
     source is cross-origin restricted, the analyser will read near
     silence — in that case we fall back to a gentle idle sweep so
     the panel never looks broken, and reattempt the real tap
     whenever the user interacts with playback/volume.
  --------------------------------------------------------------- */
  let audioCtx = null, analyser = null, sourceNode = null, timeData = null, audioReady = false;

  function ensureAudioAnalyser(){
    if (audioReady) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      return;
    }
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaElementSource(video);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      timeData = new Uint8Array(analyser.fftSize);
      audioReady = true;
    }catch(err){
      console.warn('ajlive: Web Audio analyser unavailable (likely CORS-restricted source) — scope will run in idle mode', err);
      audioReady = false;
    }
  }

  const scopeCanvas = document.getElementById('ajScope');
  const scopeCtx = scopeCanvas ? scopeCanvas.getContext('2d') : null;
  let idlePhase = 0;

  function sizeScopeCanvas(){
    if (!scopeCanvas) return;
    const rect = scopeCanvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    scopeCanvas.width = Math.max(1, Math.round(rect.width * dpr));
    scopeCanvas.height = Math.max(1, Math.round(rect.height * dpr));
  }
  sizeScopeCanvas();
  window.addEventListener('resize', sizeScopeCanvas);

  function drawScope(){
    requestAnimationFrame(drawScope);
    if (!scopeCtx || !scopeCanvas.width) return;
    const w = scopeCanvas.width, h = scopeCanvas.height;
    scopeCtx.clearRect(0, 0, w, h);

    // faint centerline, like a real scope graticule
    scopeCtx.strokeStyle = 'rgba(255,255,255,.06)';
    scopeCtx.lineWidth = 1;
    scopeCtx.beginPath();
    scopeCtx.moveTo(0, h/2); scopeCtx.lineTo(w, h/2);
    scopeCtx.stroke();

    scopeCtx.strokeStyle = '#4be08a';
    scopeCtx.lineWidth = Math.max(1, h * 0.045);
    scopeCtx.shadowColor = 'rgba(75,224,138,.65)';
    scopeCtx.shadowBlur = 4;
    scopeCtx.beginPath();

    const active = audioReady && !video.paused && !video.muted;
    if (active && analyser) {
      analyser.getByteTimeDomainData(timeData);
      const step = w / timeData.length;
      for (let i = 0; i < timeData.length; i++){
        const v = timeData[i] / 128.0;
        const y = (v * h) / 2;
        const x = i * step;
        if (i === 0) scopeCtx.moveTo(x, y); else scopeCtx.lineTo(x, y);
      }
    } else {
      // idle mode: gentle synthetic sweep so the panel stays alive
      idlePhase += 0.045;
      const amp = h * 0.06;
      for (let x = 0; x <= w; x += 2){
        const y = h/2 + Math.sin(x * 0.05 + idlePhase) * amp * Math.sin(idlePhase * 0.3 + 1);
        if (x === 0) scopeCtx.moveTo(x, y); else scopeCtx.lineTo(x, y);
      }
    }
    scopeCtx.stroke();
    scopeCtx.shadowBlur = 0;
  }
  requestAnimationFrame(drawScope);

  /* ---------------------------------------------------------------
     Volume + mute
  --------------------------------------------------------------- */
  const muteBtn = document.getElementById('ajMuteBtn');
  const volumeBar = document.getElementById('ajVolumeBar');
  const volumeBarInner = document.getElementById('ajVolumeBarInner');

  function setVolumeUI(){
    if (!volumeBarInner) return;
    const pct = video.muted ? 0 : Math.round(video.volume * 100);
    volumeBarInner.style.width = pct + '%';
  }
  video.volume = 1;
  setVolumeUI();

  if (muteBtn) {
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      setVolumeUI();
      ensureAudioAnalyser();
    });
  } else {
    console.warn('ajlive: #ajMuteBtn not found — mute toggle disabled');
  }

  if (volumeBar) {
    let draggingVol = false;
    function setVolFromEvent(e){
      const rect = volumeBar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.min(1, Math.max(0, pct));
      video.volume = pct;
      video.muted = pct === 0;
      setVolumeUI();
    }
    volumeBar.addEventListener('mousedown', (e) => { draggingVol = true; setVolFromEvent(e); ensureAudioAnalyser(); });
    document.addEventListener('mousemove', (e) => { if (draggingVol) setVolFromEvent(e); });
    document.addEventListener('mouseup', () => draggingVol = false);
    volumeBar.addEventListener('click', setVolFromEvent);
  } else {
    console.warn('ajlive: #ajVolumeBar not found — volume slider disabled');
  }

  /* ---------------------------------------------------------------
     Picture-in-Picture
  --------------------------------------------------------------- */
  const pipBtn = document.getElementById('ajPipBtn');
  if (pipBtn) {
    pipBtn.addEventListener('click', async () => {
      try{
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
        else notice('Picture in picture not supported', 1800);
      }catch(err){ notice('Picture in picture unavailable', 1800); }
    });
  } else {
    console.warn('ajlive: #ajPipBtn not found — PIP control disabled');
  }

  /* ---------------------------------------------------------------
     Fullscreen
  --------------------------------------------------------------- */
  const fullBtn = document.getElementById('ajFullBtn');
  function isFullscreen(){
    return document.fullscreenElement === player || document.webkitFullscreenElement === player;
  }
  function toggleFullscreen(){
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    } else {
      const req = player.requestFullscreen || player.webkitRequestFullscreen;
      if (req) req.call(player);
      else notice('Fullscreen not supported', 1800);
    }
  }
  if (fullBtn) fullBtn.addEventListener('click', toggleFullscreen);
  else console.warn('ajlive: #ajFullBtn not found — fullscreen control disabled');

  document.addEventListener('fullscreenchange', () => { player.classList.toggle('aj-fulled', isFullscreen()); sizeScopeCanvas(); });
  document.addEventListener('webkitfullscreenchange', () => { player.classList.toggle('aj-fulled', isFullscreen()); sizeScopeCanvas(); });

  /* ---------------------------------------------------------------
     Auto-hide controls
  --------------------------------------------------------------- */
  let hideTimer = null;
  function showControls(){
    player.classList.remove('aj-hide-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!video.paused) player.classList.add('aj-hide-controls');
    }, 2600);
  }
  player.addEventListener('mousemove', showControls);
  player.addEventListener('mouseleave', () => { if (!video.paused) player.classList.add('aj-hide-controls'); });
  player.addEventListener('touchstart', showControls);
  showControls();

  /* ---------------------------------------------------------------
     Viewer counter (cosmetic — wire to real analytics if available)
  --------------------------------------------------------------- */
  const viewerCountEl = document.getElementById('ajViewerCount');
  let viewers = 1240 + Math.floor(Math.random()*300);
  if (viewerCountEl) viewerCountEl.textContent = viewers.toLocaleString();
  setInterval(() => {
    viewers += Math.floor(Math.random()*11) - 5;
    viewers = Math.max(50, viewers);
    if (viewerCountEl) viewerCountEl.textContent = viewers.toLocaleString();
  }, 4000);
})();
</script>
</body>
</html>
