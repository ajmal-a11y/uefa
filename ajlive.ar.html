<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AJ.Live</title>
<!-- Only dependency: hls.js. No DPlayer. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --aj-bg:#0a0b0c;
    --aj-panel:#17181a;
    --aj-panel-alt:#1d1f21;
    --aj-hair: rgba(255,255,255,.10);
    --aj-hair-strong: rgba(255,255,255,.20);
    --aj-text:#eae7e0;
    --aj-text-dim:#8d8a83;
    --aj-tally:#e2271c;
    --aj-tally-glow: rgba(226,39,28,.4);
    --aj-amber:#e8a53b;
    --aj-green:#5fbf6b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--aj-bg); overflow:hidden; font-family:'IBM Plex Sans',system-ui,sans-serif; }

  .ajlive-player{
    position:absolute; inset:0; width:100%; height:100%;
    overflow:hidden; -webkit-user-select:none; user-select:none; line-height:1;
    background:#000; font-family:'IBM Plex Sans',system-ui,sans-serif; cursor:default;
  }
  .ajlive-player *{ box-sizing:border-box; }
  .ajlive-player.aj-fulled{ position:fixed; z-index:100000; left:0; top:0; width:100% !important; height:100% !important; }
  .ajlive-player.aj-hide-controls{ cursor:none; }

  .ajlive-video{ position:absolute; inset:0; width:100%; height:100%; background:#000; object-fit:contain; }

  .ajlive-overlay-scanlines{ position:absolute; inset:0; pointer-events:none; z-index:1; opacity:.05;
    background:repeating-linear-gradient(to bottom,#fff 0px,#fff 1px,transparent 1px,transparent 3px); mix-blend-mode:overlay; }
  .ajlive-overlay-vignette{ position:absolute; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 20%),linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 14%);
    transition:opacity .3s ease; }
  .ajlive-player.aj-playing.aj-hide-controls .ajlive-overlay-vignette{ opacity:0; }

  .ajlive-frame{ position:absolute; inset:16px; pointer-events:none; z-index:2; opacity:.55; transition:opacity .35s ease; }
  .ajlive-player.aj-hide-controls .ajlive-frame{ opacity:0; }
  .ajlive-frame span{ position:absolute; width:18px; height:18px; border-color:rgba(255,255,255,.75); }
  .ajlive-frame .fc-tl{ top:0; left:0; border-top:1.5px solid; border-left:1.5px solid; }
  .ajlive-frame .fc-tr{ top:0; right:0; border-top:1.5px solid; border-right:1.5px solid; }
  .ajlive-frame .fc-bl{ bottom:0; left:0; border-bottom:1.5px solid; border-left:1.5px solid; }
  .ajlive-frame .fc-br{ bottom:0; right:0; border-bottom:1.5px solid; border-right:1.5px solid; }

  .ajlive-header{ position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:flex-start;
    justify-content:space-between; padding:16px 18px; transition:transform .35s ease, opacity .35s ease; pointer-events:none; }
  .ajlive-player.aj-hide-controls .ajlive-header{ transform:translateY(-10px); opacity:0; }
  .ajlive-bug{ display:flex; align-items:center; gap:9px; }
  .ajlive-bug-mark{ width:26px; height:26px; border:1.5px solid var(--aj-hair-strong); border-radius:3px; display:flex;
    align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;
    color:var(--aj-text); background:rgba(0,0,0,.3); }
  .ajlive-bug-text{ display:flex; flex-direction:column; line-height:1; gap:2px; }
  .ajlive-bug-word{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px; letter-spacing:1.5px;
    color:var(--aj-text); text-transform:uppercase; }
  .ajlive-bug-sub{ font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--aj-text-dim); }
  .ajlive-readout{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; background:rgba(10,10,10,.4);
    padding:5px 10px; border:1px solid var(--aj-hair); }
  .ajlive-readout-label{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:1.5px; color:var(--aj-text-dim); text-transform:uppercase; }
  .ajlive-readout-value{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--aj-text); }

  .ajlive-bigplay{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9); z-index:2;
    width:60px; height:60px; border:1.5px solid rgba(255,255,255,.5); background:rgba(10,10,10,.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .25s ease, transform .25s ease, border-color .15s ease, background .15s ease; }
  .ajlive-bigplay:hover{ border-color:#fff; background:rgba(20,20,20,.6); }
  .ajlive-player.aj-paused .ajlive-bigplay{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .ajlive-player.aj-loading .ajlive-bigplay{ display:none; }
  .ajlive-bigplay svg{ width:22px; height:22px; margin-left:3px; }

  .ajlive-loading{ display:none; position:absolute; top:50%; left:50%; margin:-18px 0 0 -18px; height:36px; width:36px; z-index:2; }
  .ajlive-player.aj-loading .ajlive-loading{ display:block; }
  .ajlive-loading i{ position:absolute; width:6px; height:6px; border-radius:1px; background:var(--aj-tally);
    animation:aj-loaddot-fade .8s ease infinite; opacity:0; }
  .ajlive-loading i:nth-child(1){ top:2px; left:15px; animation-delay:0s; }
  .ajlive-loading i:nth-child(2){ top:6px; left:24px; animation-delay:.1s; }
  .ajlive-loading i:nth-child(3){ top:15px; left:28px; animation-delay:.2s; }
  .ajlive-loading i:nth-child(4){ top:24px; left:24px; animation-delay:.3s; }
  .ajlive-loading i:nth-child(5){ top:28px; left:15px; animation-delay:.4s; }
  .ajlive-loading i:nth-child(6){ top:24px; left:6px;  animation-delay:.5s; }
  .ajlive-loading i:nth-child(7){ top:15px; left:2px;  animation-delay:.6s; }
  .ajlive-loading i:nth-child(8){ top:6px;  left:6px;  animation-delay:.7s; }
  @keyframes aj-loaddot-fade{ 0%{opacity:.7;transform:scale(1.2,1.2);} 50%{opacity:.25;transform:scale(.9,.9);} to{opacity:.25;transform:scale(.85,.85);} }
  .ajlive-scanloader-label{ position:absolute; top:calc(50% + 26px); left:0; right:0; text-align:center; z-index:2;
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--aj-text-dim); text-transform:uppercase;
    opacity:0; transition:opacity .2s ease; pointer-events:none; }
  .ajlive-player.aj-loading .ajlive-scanloader-label{ opacity:1; }

  .ajlive-controller{ position:absolute; bottom:0; left:0; right:0; height:52px; padding:0 10px;
    background:var(--aj-panel); border-top:1px solid var(--aj-tally); z-index:3;
    box-shadow:0 -1px 0 rgba(0,0,0,.6), 0 -10px 26px rgba(0,0,0,.4);
    transition:transform .3s ease, opacity .3s ease;
    display:flex; align-items:center; justify-content:space-between; }
  .ajlive-player.aj-hide-controls .ajlive-controller{ transform:translateY(100%); opacity:0; }
  @media (min-width:900px){
    .ajlive-player.aj-playing .ajlive-controller{ opacity:0; }
    .ajlive-player.aj-playing:hover .ajlive-controller{ opacity:1; }
    .ajlive-player.aj-playing.aj-hide-controls .ajlive-controller{ opacity:0; }
  }

  .ajlive-icons{ height:38px; display:flex; align-items:center; gap:2px; }
  .ajlive-icon{ width:36px; height:36px; border:none; background:transparent; outline:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; padding:8px; border-radius:2px; flex:0 0 auto; }
  .ajlive-icon:hover{ background:var(--aj-panel-alt); }
  .ajlive-icon svg{ width:100%; height:100%; }
  .ajlive-icon svg path, .ajlive-icon svg rect, .ajlive-icon svg circle{ fill:var(--aj-text); }
  .ajlive-icon .aj-icon-play{ display:block; }
  .ajlive-icon .aj-icon-pause{ display:none; }
  .ajlive-player.aj-playing .aj-icon-play{ display:none; }
  .ajlive-player.aj-playing .aj-icon-pause{ display:block; }

  .ajlive-live-badge{
    display:flex; align-items:center; gap:6px; height:26px; padding:0 10px; margin-left:4px;
    border:1px solid var(--aj-tally); background:rgba(226,39,28,.08);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px; letter-spacing:1.2px;
    color:var(--aj-tally); text-transform:uppercase; line-height:1; flex:0 0 auto;
  }
  .ajlive-live-dot{ width:6px; height:6px; border-radius:1px; background:var(--aj-tally);
    box-shadow:0 0 6px var(--aj-tally-glow); animation:aj-flicker 5s ease-in-out infinite; }
  @keyframes aj-flicker{ 0%,92%,100%{opacity:1;} 93%{opacity:.55;} 94%{opacity:1;} 96%{opacity:.7;} 97%{opacity:1;} }

  .ajlive-tc{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--aj-text-dim); letter-spacing:1px;
    padding:0 8px; white-space:nowrap; display:inline-flex; align-items:center; height:36px; flex:0 0 auto; }
  .ajlive-tc b{ color:var(--aj-text); font-weight:600; margin-left:4px; }
  .ajlive-golive{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; margin-left:6px;
    border:1px solid var(--aj-hair-strong); background:transparent; color:var(--aj-text-dim);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px; letter-spacing:1.2px;
    text-transform:uppercase; cursor:pointer; flex:0 0 auto; }
  .ajlive-golive:hover{ border-color:var(--aj-text); color:var(--aj-text); }
  .ajlive-golive .dot{ width:5px; height:5px; background:var(--aj-text-dim); }
  .ajlive-vu{ display:inline-flex; align-items:flex-end; gap:2px; height:16px; padding:0 8px; flex:0 0 auto; }
  .ajlive-vu i{ width:3px; border-radius:.5px; background:var(--aj-hair-strong); display:block; transition:height .09s linear, background .09s linear; }

  .ajlive-icons-left{ display:flex; align-items:center; overflow:hidden; min-width:0; }
  .ajlive-icons-right{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }

  .ajlive-volume{ position:relative; display:inline-flex; align-items:center; height:100%; }
  .ajlive-volume-bar-wrap{ display:inline-block; margin:0 6px 0 0; width:0; overflow:hidden; transition:width .2s ease; height:100%; align-items:center; }
  .ajlive-volume:hover .ajlive-volume-bar-wrap, .ajlive-volume.aj-active .ajlive-volume-bar-wrap{ width:60px; display:flex; }
  .ajlive-volume-bar{ position:relative; width:50px; height:3px; background:var(--aj-hair-strong); cursor:pointer; }
  .ajlive-volume-bar-inner{ position:absolute; top:0; left:0; bottom:0; background:var(--aj-text); width:100%; }

  .ajlive-setting{ position:relative; display:inline-flex; align-items:center; height:100%; }
  .ajlive-setting-box{ position:absolute; right:0; bottom:44px; transform:scale(.97) translateY(6px);
    width:90px; text-align:center; background:var(--aj-panel); border:1px solid var(--aj-hair-strong); padding:2px; overflow:hidden;
    opacity:0; pointer-events:none; transition:opacity .14s ease, transform .14s ease; z-index:4; }
  .ajlive-setting-box.aj-open{ opacity:1; pointer-events:auto; transform:scale(1) translateY(0); }
  .ajlive-setting-item{ height:32px; padding:0 10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:12.5px; color:var(--aj-text); font-family:'IBM Plex Sans',sans-serif; }
  .ajlive-setting-item:hover{ background:var(--aj-panel-alt); }
  .ajlive-setting-item.aj-active{ color:var(--aj-tally); }

  .ajlive-pip-btn svg{ width:18px; height:18px; }

  .ajlive-notice-list{ position:absolute; bottom:64px; left:18px; z-index:5; }
  .ajlive-notice{ border:1px solid var(--aj-hair-strong); border-left:2px solid var(--aj-tally); background:var(--aj-panel);
    color:var(--aj-text); display:table; pointer-events:none; font-family:'IBM Plex Sans',sans-serif; font-size:12.5px;
    animation:aj-notice-show .25s ease 1 forwards; }
  @keyframes aj-notice-show{ from{padding:0;font-size:0;margin-top:0;opacity:0;} to{padding:8px 13px;font-size:12.5px;margin-top:6px;opacity:1;} }
  .ajlive-notice.aj-remove{ animation:aj-notice-hide .25s ease 1 forwards; }
  @keyframes aj-notice-hide{ from{padding:8px 13px;font-size:12.5px;margin-top:6px;opacity:1;} to{padding:0;font-size:0;margin-top:0;opacity:0;} }

  @media (max-width:640px){
    .ajlive-header{ padding:12px 12px; }
    .ajlive-readout{ display:none; }
    .ajlive-vu, .ajlive-tc{ display:none; }
    .ajlive-icon{ width:32px; height:32px; }
    .ajlive-controller{ height:46px; }
  }
</style>
</head>
<body>

<div id="ajlivePlayer" class="ajlive-player aj-paused aj-loading">
  <video id="ajVideo" class="ajlive-video" playsinline webkit-playsinline muted></video>

  <div class="ajlive-overlay-vignette"></div>
  <div class="ajlive-overlay-scanlines"></div>
  <div class="ajlive-frame"><span class="fc-tl"></span><span class="fc-tr"></span><span class="fc-bl"></span><span class="fc-br"></span></div>

  <div class="ajlive-header">
    <div class="ajlive-bug">
      <div class="ajlive-bug-mark">AJ</div>
      <div class="ajlive-bug-text">
        <div class="ajlive-bug-word">AJ.Live</div>
        <div class="ajlive-bug-sub">TRANSMISSION</div>
      </div>
    </div>
    <div class="ajlive-readout">
      <span class="ajlive-readout-label">Viewers</span>
      <span class="ajlive-readout-value" id="ajViewerCount">—</span>
    </div>
  </div>

  <div class="ajlive-bigplay" id="ajBigPlay">
    <svg viewBox="0 0 24 24" fill="var(--aj-text)"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div class="ajlive-loading" id="ajLoading">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <div class="ajlive-scanloader-label">Acquiring signal</div>

  <div class="ajlive-notice-list" id="ajNoticeList"></div>

  <div class="ajlive-controller" id="ajController">
    <div class="ajlive-icons-left" id="ajIconsLeft">
      <button class="ajlive-icon" id="ajPlayBtn" title="Play/Pause">
        <svg class="aj-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="aj-icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="ajlive-live-badge"><span class="ajlive-live-dot"></span>LIVE</div>
      <span class="ajlive-tc">TC <b id="ajTcVal">00:00:00</b></span>
      <span class="ajlive-golive" id="ajGoLive"><span class="dot"></span><span id="ajGoLiveText">LIVE</span></span>
      <span class="ajlive-vu" id="ajVu"><i></i><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="ajlive-icons-right">
      <div class="ajlive-volume" id="ajVolume">
        <button class="ajlive-icon" id="ajMuteBtn" title="Mute/Unmute">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <div class="ajlive-volume-bar-wrap">
          <div class="ajlive-volume-bar" id="ajVolumeBar">
            <div class="ajlive-volume-bar-inner" id="ajVolumeBarInner" style="width:0%"></div>
          </div>
        </div>
      </div>

      <div class="ajlive-setting" id="ajSetting">
        <button class="ajlive-icon" id="ajSettingBtn" title="Speed">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 00.12-.61l-1.92-3.32a.5.5 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.5.5 0 0014 2h-4a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 00-.59.22L2.62 8.48a.5.5 0 00.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.5.5 0 00-.12.61l1.92 3.32c.14.22.4.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.28.27.42.5.42h4c.24 0 .46-.14.5-.42l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.45 0 .59-.22l1.92-3.32a.5.5 0 00-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg>
        </button>
        <div class="ajlive-setting-box" id="ajSettingBox">
          <div class="ajlive-setting-item aj-speed-item aj-active" data-speed="1">1x (Live)</div>
          <div class="ajlive-setting-item aj-speed-item" data-speed="0.5">0.5x</div>
          <div class="ajlive-setting-item aj-speed-item" data-speed="1.5">1.5x</div>
          <div class="ajlive-setting-item aj-speed-item" data-speed="2">2x</div>
        </div>
      </div>

      <button class="ajlive-icon ajlive-pip-btn" id="ajPipBtn" title="Picture in picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--aj-text)" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="0.5"/><rect x="12" y="11.5" width="7" height="5" fill="var(--aj-text)" stroke="none"/></svg>
      </button>

      <button class="ajlive-icon" id="ajFullBtn" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  const streamUrl = 'https://majed-koora.com/wewe/m3.php';
  const player = document.getElementById('ajlivePlayer');
  const video  = document.getElementById('ajVideo');

  if (!player || !video) {
    console.error('ajlive: required root elements (#ajlivePlayer / #ajVideo) not found — aborting init');
    return;
  }

  /* ---------------------------------------------------------------
     Notices (replacement for DPlayer's dp.notice API)
  --------------------------------------------------------------- */
  const noticeList = document.getElementById('ajNoticeList');
  function notice(text, duration){
    duration = duration || 2000;
    if (!noticeList) { console.log('[ajlive notice]', text); return; }
    const el = document.createElement('div');
    el.className = 'ajlive-notice';
    el.textContent = text;
    noticeList.appendChild(el);
    setTimeout(() => {
      el.classList.add('aj-remove');
      setTimeout(() => el.remove(), 260);
    }, duration);
  }

  /* ---------------------------------------------------------------
     hls.js setup — this is the actual streaming engine
  --------------------------------------------------------------- */
  let hls = null;

  function setLoading(isLoading){
    player.classList.toggle('aj-loading', isLoading);
  }

  function initStream(){
    setLoading(true);

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Native HLS support (Safari/iOS) — no hls.js needed
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => attemptAutoplay());
    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, enableWorker: false });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setLoading(false);
        attemptAutoplay();
      });

      hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data) return;
        if (data.fatal) {
          notice('SIGNAL LOST — reconnecting', 2500);
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hls.recoverMediaError();
              break;
            default:
              hls.destroy();
              initStream(); // full rebuild as last resort
              break;
          }
        }
      });
    } else {
      console.error('ajlive: neither native HLS nor hls.js is available/supported in this browser');
      notice('Playback not supported in this browser', 4000);
      setLoading(false);
    }
  }

  function attemptAutoplay(){
    video.muted = true; // required for autoplay policies
    video.play().catch(() => {
      // autoplay blocked — show big play button, user must click
      setLoading(false);
      player.classList.add('aj-paused');
    });
  }

  initStream();

  /* ---------------------------------------------------------------
     Play / pause state sync
  --------------------------------------------------------------- */
  video.addEventListener('playing', () => {
    player.classList.remove('aj-paused');
    player.classList.add('aj-playing');
    setLoading(false);
    if (!sessionStart) sessionStart = Date.now();
  });
  video.addEventListener('pause', () => {
    player.classList.add('aj-paused');
    player.classList.remove('aj-playing');
  });
  video.addEventListener('waiting', () => setLoading(true));
  video.addEventListener('canplay', () => setLoading(false));

  function togglePlay(){
    if (video.paused) video.play().catch(() => notice('Unable to play', 1800));
    else video.pause();
  }

  const bigPlayBtn = document.getElementById('ajBigPlay');
  if (bigPlayBtn) bigPlayBtn.addEventListener('click', togglePlay);
  else console.warn('ajlive: #ajBigPlay not found — big play button disabled');

  const playBtn = document.getElementById('ajPlayBtn');
  if (playBtn) playBtn.addEventListener('click', togglePlay);
  else console.warn('ajlive: #ajPlayBtn not found — controller play button disabled');

  /* ---------------------------------------------------------------
     Timecode
  --------------------------------------------------------------- */
  let sessionStart = null;
  const tcVal = document.getElementById('ajTcVal');
  function fmt(t){
    if (!isFinite(t) || t < 0) t = 0;
    const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = Math.floor(t%60);
    const pad = n => String(n).padStart(2,'0');
    return pad(h)+':'+pad(m)+':'+pad(s);
  }
  setInterval(() => {
    if (sessionStart && !video.paused && tcVal) tcVal.textContent = fmt((Date.now()-sessionStart)/1000);
  }, 1000);

  /* ---------------------------------------------------------------
     Go-live button + speed menu (desyncs when user changes speed)
  --------------------------------------------------------------- */
  const goLive = document.getElementById('ajGoLive');
  const goLiveText = document.getElementById('ajGoLiveText');
  function setLiveEdge(isLive){
    if (goLiveText) goLiveText.textContent = isLive ? 'LIVE' : 'GO LIVE';
    if (goLive) goLive.style.color = isLive ? 'var(--aj-text-dim)' : 'var(--aj-text)';
  }
  if (goLive) {
    goLive.addEventListener('click', () => {
      video.playbackRate = 1;
      if (video.seekable && video.seekable.length){
        video.currentTime = video.seekable.end(video.seekable.length - 1) - 0.5;
      }
      setLiveEdge(true);
      video.play().catch(() => {});
      document.querySelectorAll('.aj-speed-item').forEach(i => i.classList.toggle('aj-active', i.dataset.speed === '1'));
    });
  } else {
    console.warn('ajlive: #ajGoLive not found — go-live control disabled');
  }

  const settingBtn = document.getElementById('ajSettingBtn');
  const settingBox = document.getElementById('ajSettingBox');
  if (settingBtn && settingBox) {
    settingBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingBox.classList.toggle('aj-open');
    });
    settingBox.querySelectorAll('.aj-speed-item').forEach(item => {
      item.addEventListener('click', () => {
        const speed = parseFloat(item.dataset.speed);
        video.playbackRate = speed;
        settingBox.querySelectorAll('.aj-speed-item').forEach(i => i.classList.remove('aj-active'));
        item.classList.add('aj-active');
        setLiveEdge(speed === 1);
        settingBox.classList.remove('aj-open');
      });
    });
    document.addEventListener('click', () => settingBox.classList.remove('aj-open'));
  } else {
    console.warn('ajlive: speed settings menu elements not found — speed control disabled');
  }

  /* ---------------------------------------------------------------
     VU meter (cosmetic, driven by actual mute/volume state)
  --------------------------------------------------------------- */
  const vu = document.getElementById('ajVu');
  const vuBars = vu ? vu.querySelectorAll('i') : [];
  function tickVu(){
    const active = !video.paused && !video.muted && video.volume > 0;
    vuBars.forEach((bar, i) => {
      const base = active ? (0.25 + Math.random()*0.75) * video.volume : 0.06;
      const h = Math.max(2, Math.round(base * (6 + i*2)));
      bar.style.height = h + 'px';
      bar.style.background = i >= 4 ? 'var(--aj-tally)' : (i >= 3 ? 'var(--aj-amber)' : (active ? 'var(--aj-green)' : 'var(--aj-hair-strong)'));
    });
    requestAnimationFrame(tickVu);
  }
  requestAnimationFrame(tickVu);

  /* ---------------------------------------------------------------
     Volume + mute
  --------------------------------------------------------------- */
  const volumeWrap = document.getElementById('ajVolume');
  const muteBtn = document.getElementById('ajMuteBtn');
  const volumeBar = document.getElementById('ajVolumeBar');
  const volumeBarInner = document.getElementById('ajVolumeBarInner');

  function setVolumeUI(){
    if (!volumeBarInner) return;
    const pct = video.muted ? 0 : Math.round(video.volume * 100);
    volumeBarInner.style.width = pct + '%';
  }
  video.volume = 1;
  setVolumeUI();

  if (muteBtn) {
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      setVolumeUI();
    });
  } else {
    console.warn('ajlive: #ajMuteBtn not found — mute toggle disabled');
  }

  if (volumeBar) {
    let draggingVol = false;
    function setVolFromEvent(e){
      const rect = volumeBar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let pct = (clientX - rect.left) / rect.width;
      pct = Math.min(1, Math.max(0, pct));
      video.volume = pct;
      video.muted = pct === 0;
      setVolumeUI();
    }
    volumeBar.addEventListener('mousedown', (e) => { draggingVol = true; setVolFromEvent(e); });
    document.addEventListener('mousemove', (e) => { if (draggingVol) setVolFromEvent(e); });
    document.addEventListener('mouseup', () => draggingVol = false);
    volumeBar.addEventListener('click', setVolFromEvent);
  } else {
    console.warn('ajlive: #ajVolumeBar not found — volume slider disabled');
  }

  /* ---------------------------------------------------------------
     Picture-in-Picture
  --------------------------------------------------------------- */
  const pipBtn = document.getElementById('ajPipBtn');
  if (pipBtn) {
    pipBtn.addEventListener('click', async () => {
      try{
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
        else notice('Picture in picture not supported', 1800);
      }catch(err){ notice('Picture in picture unavailable', 1800); }
    });
  } else {
    console.warn('ajlive: #ajPipBtn not found — PIP control disabled');
  }

  /* ---------------------------------------------------------------
     Fullscreen
  --------------------------------------------------------------- */
  const fullBtn = document.getElementById('ajFullBtn');
  function isFullscreen(){
    return document.fullscreenElement === player || document.webkitFullscreenElement === player;
  }
  function toggleFullscreen(){
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    } else {
      const req = player.requestFullscreen || player.webkitRequestFullscreen;
      if (req) req.call(player);
      else notice('Fullscreen not supported', 1800);
    }
  }
  if (fullBtn) fullBtn.addEventListener('click', toggleFullscreen);
  else console.warn('ajlive: #ajFullBtn not found — fullscreen control disabled');

  document.addEventListener('fullscreenchange', () => player.classList.toggle('aj-fulled', isFullscreen()));
  document.addEventListener('webkitfullscreenchange', () => player.classList.toggle('aj-fulled', isFullscreen()));

  /* ---------------------------------------------------------------
     Auto-hide controls
  --------------------------------------------------------------- */
  let hideTimer = null;
  function showControls(){
    player.classList.remove('aj-hide-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!video.paused) player.classList.add('aj-hide-controls');
    }, 2600);
  }
  player.addEventListener('mousemove', showControls);
  player.addEventListener('mouseleave', () => { if (!video.paused) player.classList.add('aj-hide-controls'); });
  player.addEventListener('touchstart', showControls);
  showControls();

  /* ---------------------------------------------------------------
     Viewer counter (cosmetic — wire to real analytics if available)
  --------------------------------------------------------------- */
  const viewerCountEl = document.getElementById('ajViewerCount');
  let viewers = 1240 + Math.floor(Math.random()*300);
  if (viewerCountEl) viewerCountEl.textContent = viewers.toLocaleString();
  setInterval(() => {
    viewers += Math.floor(Math.random()*11) - 5;
    viewers = Math.max(50, viewers);
    if (viewerCountEl) viewerCountEl.textContent = viewers.toLocaleString();
  }, 4000);
})();
</script>
</body>
</html>
