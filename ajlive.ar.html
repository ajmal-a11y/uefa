<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AJ.Live</title>
<!-- hls.js first (DPlayer's built-in 'hls' type looks for window.Hls) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<!-- DPlayer engine — JS only. We intentionally do NOT load DPlayer's default CSS. -->
<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --aj-bg:#0a0b0c;
    --aj-panel:#17181a;
    --aj-panel-alt:#1d1f21;
    --aj-hair: rgba(255,255,255,.10);
    --aj-hair-strong: rgba(255,255,255,.20);
    --aj-text:#eae7e0;
    --aj-text-dim:#8d8a83;
    --aj-tally:#e2271c;
    --aj-tally-glow: rgba(226,39,28,.4);
    --aj-amber:#e8a53b;
    --aj-green:#5fbf6b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--aj-bg); overflow:hidden; font-family:'IBM Plex Sans',system-ui,sans-serif; }

  .ajlive-player{
    position:absolute; inset:0; width:100%; height:100%;
    overflow:hidden; -webkit-user-select:none; user-select:none; line-height:1;
    background:#000; font-family:'IBM Plex Sans',system-ui,sans-serif;
  }
  .ajlive-player *{ box-sizing:border-box; }
  .ajlive-player svg{ width:100%; height:100%; }
  .ajlive-player svg path, .ajlive-player svg circle{ fill:var(--aj-text); }
  .ajlive-player:-webkit-full-screen{ width:100%; height:100%; background:#000; position:fixed; z-index:100000; left:0; top:0; margin:0; padding:0; }
  .ajlive-player.dplayer-fulled{ position:fixed; z-index:100000; left:0; top:0; width:100% !important; height:100% !important; }
  .ajlive-player.dplayer-hide-controller{ cursor:none; }

  .ajlive-player .dplayer-video-wrap{ position:relative; background:#000; font-size:0; width:100%; height:100%; }
  .ajlive-player .dplayer-video-wrap .dplayer-video{ width:100%; height:100%; display:none; object-fit:contain; }
  .ajlive-player .dplayer-video-wrap .dplayer-video-current{ display:block; }
  .ajlive-player .dplayer-mask{ position:absolute; inset:0; z-index:1; display:none; }
  .ajlive-player .dplayer-mask.dplayer-mask-show{ display:block; }

  .ajlive-overlay-scanlines{ position:absolute; inset:0; pointer-events:none; z-index:1; opacity:.05;
    background:repeating-linear-gradient(to bottom,#fff 0px,#fff 1px,transparent 1px,transparent 3px); mix-blend-mode:overlay; }
  .ajlive-overlay-vignette{ position:absolute; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 20%),linear-gradient(to bottom,rgba(0,0,0,.5) 0%,transparent 14%);
    transition:opacity .3s ease; }
  .ajlive-player.dplayer-playing.dplayer-hide-controller .ajlive-overlay-vignette{ opacity:0; }

  .ajlive-frame{ position:absolute; inset:16px; pointer-events:none; z-index:2; opacity:.55; transition:opacity .35s ease; }
  .ajlive-player.dplayer-hide-controller .ajlive-frame{ opacity:0; }
  .ajlive-frame span{ position:absolute; width:18px; height:18px; border-color:rgba(255,255,255,.75); }
  .ajlive-frame .fc-tl{ top:0; left:0; border-top:1.5px solid; border-left:1.5px solid; }
  .ajlive-frame .fc-tr{ top:0; right:0; border-top:1.5px solid; border-right:1.5px solid; }
  .ajlive-frame .fc-bl{ bottom:0; left:0; border-bottom:1.5px solid; border-left:1.5px solid; }
  .ajlive-frame .fc-br{ bottom:0; right:0; border-bottom:1.5px solid; border-right:1.5px solid; }

  .ajlive-header{ position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:flex-start;
    justify-content:space-between; padding:16px 18px; transition:transform .35s ease, opacity .35s ease; pointer-events:none; }
  .ajlive-player.dplayer-hide-controller .ajlive-header{ transform:translateY(-10px); opacity:0; }
  .ajlive-bug{ display:flex; align-items:center; gap:9px; }
  .ajlive-bug-mark{ width:26px; height:26px; border:1.5px solid var(--aj-hair-strong); border-radius:3px; display:flex;
    align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;
    color:var(--aj-text); background:rgba(0,0,0,.3); }
  .ajlive-bug-text{ display:flex; flex-direction:column; line-height:1; gap:2px; }
  .ajlive-bug-word{ font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:16px; letter-spacing:1.5px;
    color:var(--aj-text); text-transform:uppercase; }
  .ajlive-bug-sub{ font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--aj-text-dim); }
  .ajlive-readout{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; background:rgba(10,10,10,.4);
    padding:5px 10px; border:1px solid var(--aj-hair); }
  .ajlive-readout-label{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:1.5px; color:var(--aj-text-dim); text-transform:uppercase; }
  .ajlive-readout-value{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--aj-text); }

  .ajlive-bigplay{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9); z-index:2;
    width:60px; height:60px; border:1.5px solid rgba(255,255,255,.5); background:rgba(10,10,10,.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .25s ease, transform .25s ease, border-color .15s ease, background .15s ease; }
  .ajlive-bigplay:hover{ border-color:#fff; background:rgba(20,20,20,.6); }
  .ajlive-player.dplayer-paused .ajlive-bigplay{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .ajlive-player.dplayer-loading .ajlive-bigplay{ display:none; }
  .ajlive-bigplay svg{ width:22px; height:22px; margin-left:3px; }

  .ajlive-player .dplayer-bezel{ position:absolute; inset:0; font-size:22px; color:var(--aj-text); pointer-events:none; }
  .ajlive-player .dplayer-bezel .dplayer-bezel-icon{ display:none; }
  .ajlive-player .dplayer-bezel .dplayer-danloading{ display:none; }
  .ajlive-player .diplayer-loading-icon{ display:none; position:absolute; top:50%; left:50%; margin:-18px 0 0 -18px; height:36px; width:36px; }
  .ajlive-player.dplayer-loading .diplayer-loading-icon{ display:block; }
  .ajlive-player .diplayer-loading-icon .diplayer-loading-dot{ animation:diplayer-loading-dot-fade .8s ease infinite; opacity:0; transform-origin:4px 4px; fill:var(--aj-tally); }
  .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-1{ animation-delay:.1s; } .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-2{ animation-delay:.2s; }
  .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-3{ animation-delay:.3s; } .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-4{ animation-delay:.4s; }
  .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-5{ animation-delay:.5s; } .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-6{ animation-delay:.6s; }
  .ajlive-player .diplayer-loading-icon .diplayer-loading-dot-7{ animation-delay:.7s; }
  @keyframes diplayer-loading-dot-fade{ 0%{opacity:.7;transform:scale(1.2,1.2);} 50%{opacity:.25;transform:scale(.9,.9);} to{opacity:.25;transform:scale(.85,.85);} }
  .ajlive-scanloader-label{ position:absolute; top:calc(50% + 26px); left:0; right:0; text-align:center; z-index:2;
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:2px; color:var(--aj-text-dim); text-transform:uppercase;
    opacity:0; transition:opacity .2s ease; }
  .ajlive-player.dplayer-loading .ajlive-scanloader-label{ opacity:1; }

  .ajlive-player .dplayer-controller-mask{ display:none; }
  .ajlive-player .dplayer-controller{ position:absolute; bottom:0; left:0; right:0; height:52px; padding:0 10px;
    background:var(--aj-panel); border-top:1px solid var(--aj-tally);
    box-shadow:0 -1px 0 rgba(0,0,0,.6), 0 -10px 26px rgba(0,0,0,.4);
    transition:transform .3s ease, opacity .3s ease; }
  .ajlive-player.dplayer-hide-controller .dplayer-controller{ transform:translateY(100%); opacity:0; }
  .ajlive-player.dplayer-show-controller .dplayer-controller{ transform:translateY(0); opacity:1; }
  @media (min-width:900px){
    .ajlive-player.dplayer-playing .dplayer-controller{ opacity:0; transform:translateY(0); }
    .ajlive-player.dplayer-playing:hover .dplayer-controller{ opacity:1; }
  }

  .ajlive-player.dplayer-live .dplayer-bar-wrap{ display:none; }
  .ajlive-player.dplayer-live .dplayer-setting-loop{ display:none; }
  .ajlive-player .dplayer-bar-wrap{ padding:5px 0; cursor:pointer; position:absolute; bottom:33px; width:calc(100% - 20px); height:3px; }
  .ajlive-player .dplayer-bar{ position:relative; height:3px; width:100%; background:rgba(255,255,255,.15); }
  .ajlive-player .dplayer-loaded{ position:absolute; inset:0; background:rgba(255,255,255,.3); height:3px; }
  .ajlive-player .dplayer-played{ position:absolute; left:0; top:0; bottom:0; height:3px; background:var(--aj-tally) !important; }
  .ajlive-player .dplayer-played .dplayer-thumb{ position:absolute; top:0; right:5px; margin:-4px -10px 0 0; height:11px; width:11px; border-radius:1px; background:var(--aj-text) !important; }

  .ajlive-player .dplayer-icons{ height:38px; position:absolute; bottom:0; display:flex; align-items:center; }
  .ajlive-player .dplayer-icons-left{ left:6px; }
  .ajlive-player .dplayer-icons-right{ right:6px; }
  .ajlive-player .dplayer-icon{ width:36px; height:36px; border:none; background:transparent; outline:none; cursor:pointer;
    box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; padding:8px !important; border-radius:2px; }
  .ajlive-player .dplayer-icon:hover{ background:var(--aj-panel-alt); }
  .ajlive-player .dplayer-icon .dplayer-icon-content{ opacity:1; transition:none; }
  .ajlive-player .dplayer-comment{ display:none !important; }

  .ajlive-player.dplayer-no-danmaku .dplayer-danmaku,
  .ajlive-player.dplayer-no-danmaku .dplayer-comment,
  .ajlive-player.dplayer-no-danmaku .dplayer-setting-showdan,
  .ajlive-player.dplayer-no-danmaku .dplayer-setting-danmaku,
  .ajlive-player.dplayer-no-danmaku .dplayer-setting-danunlimit{ display:none !important; }

  .ajlive-player.dplayer-live .dplayer-time{ display:none; }
  .ajlive-player .dplayer-time{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--aj-text-dim); line-height:36px; padding:0 6px; }
  .ajlive-player .dplayer-live-badge{
    display:flex !important; align-items:center; gap:6px; height:26px; padding:0 10px; margin-left:4px;
    border:1px solid var(--aj-tally); background:rgba(226,39,28,.08);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px; letter-spacing:1.2px;
    color:var(--aj-tally) !important; text-transform:uppercase; line-height:1;
  }
  .ajlive-player .dplayer-live-dot{ width:6px; height:6px; border-radius:1px !important; background:var(--aj-tally) !important;
    box-shadow:0 0 6px var(--aj-tally-glow); animation:aj-flicker 5s ease-in-out infinite; margin:0 !important; }
  @keyframes aj-flicker{ 0%,92%,100%{opacity:1;} 93%{opacity:.55;} 94%{opacity:1;} 96%{opacity:.7;} 97%{opacity:1;} }

  .ajlive-tc{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--aj-text-dim); letter-spacing:1px;
    padding:0 8px; white-space:nowrap; display:inline-flex; align-items:center; height:36px; }
  .ajlive-tc b{ color:var(--aj-text); font-weight:600; margin-left:4px; }
  .ajlive-golive{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; margin-left:6px;
    border:1px solid var(--aj-hair-strong); background:transparent; color:var(--aj-text-dim);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:10.5px; letter-spacing:1.2px;
    text-transform:uppercase; cursor:pointer; vertical-align:middle; }
  .ajlive-golive:hover{ border-color:var(--aj-text); color:var(--aj-text); }
  .ajlive-golive .dot{ width:5px; height:5px; background:var(--aj-text-dim); }
  .ajlive-vu{ display:inline-flex; align-items:flex-end; gap:2px; height:16px; padding:0 8px; vertical-align:middle; }
  .ajlive-vu i{ width:3px; border-radius:.5px; background:var(--aj-hair-strong); display:block; transition:height .09s linear, background .09s linear; }

  .ajlive-player .dplayer-volume{ position:relative; display:inline-block; cursor:pointer; height:100%; }
  .ajlive-player .dplayer-volume-bar-wrap{ display:inline-block; margin:0 10px 0 -5px; vertical-align:middle; height:100%; }
  .ajlive-player .dplayer-volume-bar{ position:relative; top:17px; width:0; height:3px; background:var(--aj-hair-strong); transition:width .2s ease; }
  .ajlive-player .dplayer-volume:hover .dplayer-volume-bar,
  .ajlive-player .dplayer-volume.dplayer-volume-active .dplayer-volume-bar{ width:50px; }
  .ajlive-player .dplayer-volume-bar-inner{ position:absolute; bottom:0; left:0; height:100%; background:var(--aj-text) !important; }
  .ajlive-player .dplayer-volume-bar-inner .dplayer-thumb{ position:absolute; top:0; right:5px; margin:-4px -10px 0 0; height:9px; width:9px; border-radius:1px; background:var(--aj-text) !important; }

  .ajlive-player .dplayer-setting{ display:inline-block; height:100%; position:relative; }
  .ajlive-player .dplayer-setting-box{ position:absolute; right:0; bottom:44px; transform:scale(.97) translateY(6px);
    width:150px; background:var(--aj-panel); border:1px solid var(--aj-hair-strong); padding:2px; overflow:hidden;
    opacity:0; pointer-events:none; transition:opacity .14s ease, transform .14s ease; z-index:2; }
  .ajlive-player .dplayer-setting-box.dplayer-setting-box-open{ opacity:1; pointer-events:auto; transform:scale(1) translateY(0); }
  .ajlive-player .dplayer-setting-box.dplayer-setting-box-narrow{ width:90px; text-align:center; }
  .ajlive-player .dplayer-setting-box > div{ display:none; }
  .ajlive-player .dplayer-setting-box > div.dplayer-setting-origin-panel{ display:block; }
  .ajlive-player .dplayer-setting-box.dplayer-setting-box-speed .dplayer-setting-origin-panel{ display:none; }
  .ajlive-player .dplayer-setting-box.dplayer-setting-box-speed .dplayer-setting-speed-panel{ display:block; }
  .ajlive-player .dplayer-setting-item, .ajlive-player .dplayer-setting-speed-item{ height:32px; padding:0 10px; display:flex; align-items:center;
    justify-content:space-between; cursor:pointer; font-size:12.5px; color:var(--aj-text); font-family:'IBM Plex Sans',sans-serif; }
  .ajlive-player .dplayer-setting-item:hover, .ajlive-player .dplayer-setting-speed-item:hover{ background:var(--aj-panel-alt); }
  .ajlive-player .dplayer-label{ color:var(--aj-text); font-size:12.5px; }
  .ajlive-player .dplayer-toggle{ width:30px; height:16px; position:relative; }
  .ajlive-player .dplayer-toggle input + label{ display:block; position:relative; height:16px; width:30px; border-radius:9px; border:1px solid var(--aj-hair-strong); cursor:pointer; }
  .ajlive-player .dplayer-toggle input + label:after{ content:''; position:absolute; left:1px; top:1px; height:12px; width:12px; border-radius:50%; background:var(--aj-text-dim); transition:.15s ease; }
  .ajlive-player .dplayer-toggle input:checked + label{ border-color:var(--aj-tally); }
  .ajlive-player .dplayer-toggle input:checked + label:after{ left:15px; background:var(--aj-tally); }

  .ajlive-player .dplayer-full{ display:inline-block; height:100%; position:relative; }
  .ajlive-player .dplayer-full .dplayer-full-in-icon{ position:absolute; top:-38px; right:0; display:none; background:var(--aj-panel); border:1px solid var(--aj-hair-strong); padding:8px; }
  .ajlive-player .dplayer-full:hover .dplayer-full-in-icon{ display:flex; }

  .ajlive-pip-btn{ width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border-radius:2px; }
  .ajlive-pip-btn:hover{ background:var(--aj-panel-alt); }
  .ajlive-pip-btn svg{ width:18px; height:18px; }

  .ajlive-player .dplayer-notice-list{ position:absolute; bottom:64px; left:18px; z-index:4; }
  .ajlive-player .dplayer-notice{ border-left:2px solid var(--aj-tally); background:var(--aj-panel); border:1px solid var(--aj-hair-strong);
    border-left:2px solid var(--aj-tally); color:var(--aj-text); display:table; pointer-events:none;
    font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; animation:aj-notice-show .25s ease 1 forwards; }
  @keyframes aj-notice-show{ from{padding:0;font-size:0;margin-top:0;} to{padding:8px 13px;font-size:12.5px;margin-top:6px;} }
  .ajlive-player .remove-notice{ animation:aj-notice-hide .25s ease 1 forwards; }
  @keyframes aj-notice-hide{ from{padding:8px 13px;font-size:12.5px;margin-top:6px;} to{padding:0;font-size:0;margin-top:0;} }

  .ajlive-player .dplayer-menu{ position:absolute; width:170px; background:var(--aj-panel); border:1px solid var(--aj-hair-strong); padding:4px; z-index:5; display:none; }
  .ajlive-player .dplayer-menu.dplayer-menu-show{ display:block; }
  .ajlive-player .dplayer-menu-item{ height:28px; cursor:pointer; }
  .ajlive-player .dplayer-menu-item:hover{ background:var(--aj-panel-alt); }
  .ajlive-player .dplayer-menu-item a{ padding:0 8px; line-height:28px; color:var(--aj-text-dim); font-size:12px; display:block; text-decoration:none; }

  .ajlive-player .dplayer-mobile-play{ display:none; width:50px; height:50px; border:none; background:transparent; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .ajlive-player.dplayer-mobile .dplayer-mobile-play{ display:block; }
  .ajlive-player.dplayer-mobile.dplayer-hide-controller .dplayer-mobile-play{ display:none; }
  .ajlive-player.dplayer-mobile .dplayer-controller .dplayer-volume,
  .ajlive-player.dplayer-mobile .dplayer-controller .dplayer-play-icon{ display:none; }

  @media (max-width:640px){
    .ajlive-header{ padding:12px 12px; }
    .ajlive-readout{ display:none; }
    .ajlive-vu, .ajlive-tc{ display:none; }
    .ajlive-player .dplayer-icon{ width:32px; height:32px; }
    .ajlive-player .dplayer-controller{ height:46px; }
  }
</style>
</head>
<body>

<div id="ajlivePlayer" class="ajlive-player">
  <div class="ajlive-overlay-vignette"></div>
  <div class="ajlive-overlay-scanlines"></div>
  <div class="ajlive-frame"><span class="fc-tl"></span><span class="fc-tr"></span><span class="fc-bl"></span><span class="fc-br"></span></div>

  <div class="ajlive-header">
    <div class="ajlive-bug">
      <div class="ajlive-bug-mark">AJ</div>
      <div class="ajlive-bug-text">
        <div class="ajlive-bug-word">AJ.Live</div>
        <div class="ajlive-bug-sub">TRANSMISSION</div>
      </div>
    </div>
    <div class="ajlive-readout">
      <span class="ajlive-readout-label">Viewers</span>
      <span class="ajlive-readout-value" id="ajViewerCount">—</span>
    </div>
  </div>

  <div class="ajlive-bigplay" id="ajBigPlay">
    <svg viewBox="0 0 24 24" fill="var(--aj-text)"><path d="M8 5v14l11-7z"/></svg>
  </div>
  <div class="ajlive-scanloader-label">Acquiring signal</div>
</div>

<script>
(function(){
  const streamUrl = 'https://majed-koora.com/wewe/m3.php';
  const container = document.getElementById('ajlivePlayer');

  if (!container) {
    console.error('ajlive: #ajlivePlayer container not found — aborting init');
    return;
  }
  if (typeof DPlayer === 'undefined') {
    console.error('ajlive: DPlayer library failed to load (check CDN / network)');
    return;
  }

  const dp = new DPlayer({
    container: container,
    live: true,
    autoplay: true,
    theme: '#e2271c',
    lang: 'en',
    screenshot: false,
    hotkey: true,
    airplay: false,
    chromecast: false,
    contextmenu: [],
    video: {
      url: streamUrl,
      type: 'hls',
      customType: {
        hls: function (video, player) {
          if (typeof Hls === 'undefined') {
            console.error('ajlive: hls.js failed to load (check CDN / network)');
            return;
          }
          const hls = new Hls({ liveSyncDurationCount: 3, enableWorker: false });
          hls.loadSource(video.src);
          hls.attachMedia(video);
          player.hls = hls;
          hls.on(Hls.Events.ERROR, function (evt, data) {
            if (data.fatal) dp.notice('SIGNAL LOST — reconnecting', 2500);
          });
        }
      }
    }
  });

  dp.video.muted = true; // satisfy autoplay policy
  dp.on('canplay', () => dp.play());

  /* ---- big custom play button synced to DPlayer's own state classes ---- */
  const bigPlayBtn = document.getElementById('ajBigPlay');
  if (bigPlayBtn) {
    bigPlayBtn.addEventListener('click', () => dp.toggle());
  } else {
    console.warn('ajlive: #ajBigPlay not found — big play button disabled');
  }

  /* ---- inject timecode / go-live / VU meter into the native icon row ---- */
  const iconsLeft = container.querySelector('.dplayer-icons-left');

  if (!iconsLeft) {
    console.warn('ajlive: .dplayer-icons-left not found — DPlayer may not have finished building its controls DOM. Timecode/GoLive/VU meter will be skipped.');
  }

  const tc = document.createElement('span');
  tc.className = 'ajlive-tc';
  tc.innerHTML = 'TC <b id="ajTcVal">00:00:00</b>';

  const goLive = document.createElement('span');
  goLive.className = 'ajlive-golive';
  goLive.innerHTML = '<span class="dot"></span><span id="ajGoLiveText">LIVE</span>';

  const vu = document.createElement('span');
  vu.className = 'ajlive-vu';
  vu.innerHTML = '<i></i><i></i><i></i><i></i><i></i>';

  if (iconsLeft) {
    iconsLeft.appendChild(tc);
    iconsLeft.appendChild(goLive);
    iconsLeft.appendChild(vu);
  }

  const vuBars = vu.querySelectorAll('i');

  function tickVu(){
    const active = !dp.video.paused && !dp.video.muted && dp.video.volume > 0;
    vuBars.forEach((bar, i) => {
      const base = active ? (0.25 + Math.random()*0.75) * dp.video.volume : 0.06;
      const h = Math.max(2, Math.round(base * (6 + i*2)));
      bar.style.height = h + 'px';
      bar.style.background = i >= 4 ? 'var(--aj-tally)' : (i >= 3 ? 'var(--aj-amber)' : (active ? 'var(--aj-green)' : 'var(--aj-hair-strong)'));
    });
    requestAnimationFrame(tickVu);
  }
  requestAnimationFrame(tickVu);

  let sessionStart = null;
  const tcVal = document.getElementById('ajTcVal');
  function fmt(t){
    if (!isFinite(t) || t < 0) t = 0;
    const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = Math.floor(t%60);
    const pad = n => String(n).padStart(2,'0');
    return pad(h)+':'+pad(m)+':'+pad(s);
  }
  dp.on('playing', () => { if (!sessionStart) sessionStart = Date.now(); });
  setInterval(() => {
    if (sessionStart && !dp.video.paused && tcVal) tcVal.textContent = fmt((Date.now()-sessionStart)/1000);
  }, 1000);

  let liveEdge = true;
  const golivetext = document.getElementById('ajGoLiveText');
  function setLiveEdge(isLive){
    liveEdge = isLive;
    goLive.classList.toggle('aj-catchup', !isLive);
    if (golivetext) golivetext.textContent = isLive ? 'LIVE' : 'GO LIVE';
    goLive.style.color = isLive ? 'var(--aj-text-dim)' : 'var(--aj-text)';
  }
  goLive.addEventListener('click', () => {
    dp.speed(1);
    if (dp.video.seekable && dp.video.seekable.length){
      dp.video.currentTime = dp.video.seekable.end(dp.video.seekable.length - 1) - 0.5;
    }
    setLiveEdge(true);
    dp.play();
  });

  const settingBox = container.querySelector('.dplayer-setting-box');
  if (settingBox) {
    settingBox.addEventListener('click', (e) => {
      const item = e.target.closest('.dplayer-setting-speed-item');
      if (item) setLiveEdge(false);
    });
  } else {
    console.warn('ajlive: .dplayer-setting-box not found — speed-change go-live desync detection disabled');
  }

  /* ---- inject PIP button before native fullscreen icon ---- */
  const fullWrap = container.querySelector('.dplayer-full');
  const pip = document.createElement('div');
  pip.className = 'ajlive-pip-btn';
  pip.title = 'Picture in picture';
  pip.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--aj-text)" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="0.5"/><rect x="12" y="11.5" width="7" height="5" fill="var(--aj-text)" stroke="none"/></svg>';

  if (fullWrap && fullWrap.parentNode) {
    fullWrap.parentNode.insertBefore(pip, fullWrap);
  } else {
    console.warn('ajlive: .dplayer-full not found — PIP button not inserted into controls, appending to icons-right as fallback');
    const iconsRight = container.querySelector('.dplayer-icons-right');
    if (iconsRight) iconsRight.appendChild(pip);
  }

  pip.addEventListener('click', async () => {
    try{
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (document.pictureInPictureEnabled) await dp.video.requestPictureInPicture();
    }catch(err){ dp.notice('Picture in picture unavailable', 1800); }
  });

  /* ---- viewer counter (cosmetic — wire to real analytics if available) ---- */
  const viewerCountEl = document.getElementById('ajViewerCount');
  let viewers = 1240 + Math.floor(Math.random()*300);
  if (viewerCountEl) viewerCountEl.textContent = viewers.toLocaleString();
  setInterval(() => {
    viewers += Math.floor(Math.random()*11) - 5;
    viewers = Math.max(50, viewers);
    if (viewerCountEl) viewerCountEl.textContent = viewers.toLocaleString();
  }, 4000);
})();
</script>
</body>
</html>
